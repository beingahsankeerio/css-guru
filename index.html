<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CCE English Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f2ea; --surface:#fffdf8; --ink:#1c2331; --muted:#5b6372; --line:#e2dccd;
  --rule:#dbe3ee; --margin:#d4455c; --accent:#1f4e8c; --accent-ink:#ffffff; --accent-soft:#e3ebf6;
  --ok:#2b7a4b; --ok-soft:#e2f1e7; --bad:#b0291f; --bad-soft:#fae6e3; --warn-soft:#fbf1d9;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161c; --surface:#1b1f27; --ink:#e6e8ed; --muted:#9aa2b0; --line:#2c313b;
  --rule:#262d3a; --margin:#e26b7e; --accent:#8db3ee; --accent-ink:#0f1b2e; --accent-soft:#21304a;
  --ok:#6cc48e; --ok-soft:#1c3226; --bad:#f08b81; --bad-soft:#3a2321; --warn-soft:#3a321c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161c; --surface:#1b1f27; --ink:#e6e8ed; --muted:#9aa2b0; --line:#2c313b;
  --rule:#262d3a; --margin:#e26b7e; --accent:#8db3ee; --accent-ink:#0f1b2e; --accent-soft:#21304a;
  --ok:#6cc48e; --ok-soft:#1c3226; --bad:#f08b81; --bad-soft:#3a2321; --warn-soft:#3a321c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:24px}
header.top h1{font-family:var(--serif);font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em}
header.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.overall{font-size:13px;color:var(--muted);text-align:right}
.overall b{font-family:var(--serif);font-size:24px;color:var(--ink);display:block;line-height:1}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
nav.ex{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 32px);overflow-y:auto}
nav.ex a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;border:1px solid transparent}
nav.ex a:hover{background:var(--surface);border-color:var(--line)}
nav.ex a.on{background:var(--surface);border-color:var(--ink)}
nav.ex .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--muted);color:var(--muted)}
nav.ex a.on .n{border-color:var(--accent);color:var(--accent)}
nav.ex .n.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
nav.ex .lbl{min-width:0}
nav.ex .lbl small{display:block;color:var(--muted);font-size:11.5px}
main{min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--margin);font-weight:600}
h2{font-family:var(--serif);font-size:clamp(24px,3vw,32px);line-height:1.15;margin:4px 0 8px;text-wrap:balance}
h3{font-family:var(--serif);font-size:20px;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);max-width:65ch;margin:0 0 20px}
.lesson{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--margin);border-radius:10px;padding:18px 20px;margin-bottom:22px}
.lesson p,.lesson li{max-width:68ch}
.lesson ul{padding-left:20px;margin:8px 0}
.formula{font-family:var(--serif);font-size:18px;background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin:10px 0}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.pair div{border-radius:8px;padding:10px 12px;font-family:var(--serif);font-size:16px}
.pair .w{background:var(--bad-soft)} .pair .s{background:var(--ok-soft)}
.pair b{font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card .qn{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.card .q{font-weight:500;margin:0 0 10px}
.ctx{font-family:var(--serif);font-size:16.5px;line-height:1.6;background:var(--bg);border-radius:8px;padding:12px 14px;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--serif);font-size:16px;line-height:1.45;background:var(--surface);color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.why{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);font-size:14px}
.why b{color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--serif);font-size:16px;cursor:pointer}
.chk input{margin-top:5px;accent-color:var(--accent)}
.chk.right{border-color:var(--ok);background:var(--ok-soft)} .chk.wrong{border-color:var(--bad);background:var(--bad-soft)} .chk.missed{border-color:var(--ok);border-style:dashed}
.spot{font-family:var(--serif);font-size:17px;line-height:1.75}
.spot button{all:unset;cursor:pointer;border-radius:4px;padding:1px 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.spot button:hover:not([disabled]){background:var(--accent-soft)}
.spot button:focus-visible{outline:2px solid var(--accent)}
.spot button.right{background:var(--ok-soft);text-decoration:line-through;text-decoration-color:var(--margin)}
.spot button.wrong{background:var(--bad-soft)}
.fill{font-family:var(--serif);font-size:17px;line-height:2}
.fill select{font:inherit;font-size:15px;font-family:var(--sans);padding:2px 6px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.fill select.right{border-color:var(--ok);background:var(--ok-soft)} .fill select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pool,.built{display:flex;flex-direction:column;gap:6px}
.pool button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 12px;border:1.5px dashed var(--muted);border-radius:8px;font-family:var(--serif);font-size:16px}
.pool button:hover{border-color:var(--accent);border-style:solid}
.pool button:focus-visible{outline:2px solid var(--accent)}
.built ol{margin:0;padding-left:22px;font-family:var(--serif);font-size:16px;display:flex;flex-direction:column;gap:4px}
.built li.right{color:var(--ok)} .built li.wrong{color:var(--bad)}
.subl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:10px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.paper{width:100%;min-height:160px;resize:vertical;font-family:var(--serif);font-size:17px;line-height:30px;padding:4px 14px 4px 52px;border:1px solid var(--line);border-radius:8px;color:var(--ink);
  background-color:var(--surface);
  background-image:linear-gradient(to right,transparent 40px,var(--margin) 40px,var(--margin) 41.5px,transparent 41.5px),repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--rule) 29px,var(--rule) 30px);
  background-attachment:local;background-position:0 4px}
.paper.short{min-height:94px}
.paper:focus{outline:2px solid var(--accent);outline-offset:1px}
.meta{font-size:12.5px;color:var(--muted)}
.fb{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;font-size:14.5px}
.fb .mark{border-left:3px solid var(--margin);padding-left:12px;white-space:normal}
.fb .mark p{margin:0 0 6px}
.fb .mark ul{margin:0 0 6px;padding-left:18px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.copied{color:var(--ok);font-size:13px}
textarea.copyout{width:100%;min-height:120px;font-size:12.5px;margin-top:8px;font-family:var(--sans);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.peel{display:grid;gap:12px}
.peel label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
.peel label span{font-weight:400;color:var(--muted)}
.peel .tag{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--margin);color:var(--surface);font-size:12px;margin-right:6px}
.preview{font-family:var(--serif);font-size:17px;line-height:1.65;background:var(--bg);border-radius:8px;padding:14px 16px;min-height:60px;max-width:72ch}
.preview .ph{color:var(--muted);font-style:italic}
.timer{font-family:var(--serif);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.timer.over{color:var(--margin)}
.topicbox{font-family:var(--serif);font-size:20px;line-height:1.35;padding:12px 16px;border:1.5px solid var(--ink);border-radius:8px;background:var(--surface)}
select.top{font:inherit;padding:7px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.grid a{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.grid a:hover{border-color:var(--ink)}
.grid .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--margin);font-weight:600}
.grid h3{margin:4px 0}
.grid p{margin:0;color:var(--muted);font-size:13.5px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:8px;max-width:68ch}
.steps li{counter-increment:s;padding-left:34px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;display:grid;place-items:center}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.pager a{color:var(--accent);text-decoration:none;font-weight:500}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500;text-transform:none;letter-spacing:0}
.navg{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--margin);font-weight:600;padding:14px 10px 4px}
.navg:first-of-type{padding-top:4px}
.passage p{margin:0 0 10px}
.passage sup{color:var(--margin);font-family:var(--sans);font-size:10px;font-weight:600;margin-right:2px}
.ptitle{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
details summary{cursor:pointer;font-weight:500;margin-bottom:8px}
.tagrows{display:flex;flex-direction:column;gap:6px}
.tagrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px}
.tagrow.right{border-color:var(--ok);background:var(--ok-soft)} .tagrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tagrow .ts{font-family:var(--serif);font-size:15.5px;line-height:1.45}
.tagrow sup{color:var(--margin);font-family:var(--sans);font-size:10px;font-weight:600;margin-right:3px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:12.5px;padding:5px 9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.tM{background:var(--ok);color:var(--surface)} .seg button.on.tS{background:var(--accent);color:var(--accent-ink)} .seg button.on.tC{background:var(--margin);color:var(--surface)}
.seg button:disabled{cursor:default}
.titlein,.prepin{font-family:var(--serif);font-size:17px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.titlein{width:100%}
.prepin{width:7.5em;margin:0 4px}
.prepin.right{border-color:var(--ok);background:var(--ok-soft)} .prepin.wrong{border-color:var(--bad);background:var(--bad-soft)}
table.pattern{border-collapse:collapse;font-size:14px;min-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table.pattern th,table.pattern td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line)}
table.pattern th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (max-width:560px){ .tagrow{grid-template-columns:minmax(0,1fr)} }
@media (max-width:820px){
  .navg{padding:6px 4px;flex:none;align-self:center}
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.ex{position:static;flex-direction:row;overflow-x:auto;overflow-y:visible;max-height:none;padding-bottom:6px;gap:6px}
  nav.ex a{flex:none;padding:6px 10px}
  nav.ex .lbl small{display:none}
  .overall{text-align:left}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>CCE English Gym</h1>
      <p>Three tracks: paragraph writing for the Essay paper, every question of the Précis &amp; Composition paper, and the grammar behind clean sentences. Built on real CSS past-paper items.</p>
    </div>
    <div class="overall"><b id="overallPct">0%</b>drills completed</div>
  </header>
  <div class="layout">
    <nav class="ex" id="nav" aria-label="Exercises"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- storage (per-viewer convenience only) ---------- */
const KEY = "paragraph-gym-v1";
let state = { items:{}, drafts:{} };
try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && typeof s === "object") state = Object.assign(state, s); } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* ---------- AI feedback via Claude (optional) ---------- */
let sample = null, aiStatus = "pending";
const aiListeners = [];
function setAi(s){ aiStatus = s; aiListeners.forEach(f=>{ try{f();}catch(e){} }); }
try {
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then(fn => { sample = fn; setAi(fn ? "ready" : "none"); }).catch(()=>setAi("none"));
  } else { setTimeout(()=>setAi("none"),0); }
} catch(e){ setTimeout(()=>setAi("none"),0); }

/* ---------- content ---------- */
const TOPICS = [
  "Climate change and Pakistan's food security",
  "Out-of-school children in Pakistan",
  "Women's economic empowerment",
  "Corruption and accountability",
  "Population growth as a challenge",
  "Social media and political polarisation",
  "CPEC: opportunity or debt trap?",
  "Local government and service delivery",
  "The energy crisis and circular debt",
  "Brain drain from Pakistan",
  "Artificial intelligence and jobs",
  "Water scarcity in Sindh",
  "Democracy and economic development",
  "Terrorism and national security",
  "The role of youth in nation-building"
];

const EX = [
{ id:1, title:"Topic sentences", sub:"Topic + controlling idea",
  lede:"Every exam paragraph lives or dies by its first sentence. The examiner should know your point before reading further.",
  lesson:`<h3>What a topic sentence does</h3>
  <p>It names the <b>topic</b> and makes a specific, arguable claim about it, the <b>controlling idea</b>. Everything else in the paragraph proves that claim.</p>
  <div class="formula">Topic + controlling idea (+ reason, if it fits) = topic sentence</div>
  <p>Four common faults:</p>
  <ul><li><b>Too broad or a cliché:</b> "Education is the backbone of a nation."</li>
  <li><b>Too narrow, just a fact:</b> "Pakistan's literacy rate is about 60 per cent." A fact is evidence, not a claim.</li>
  <li><b>An announcement:</b> "In this paragraph I will discuss…"</li>
  <li><b>A question:</b> "Is democracy good for Pakistan?"</li></ul>
  <div class="pair"><div class="w"><b>Weak</b>Corruption is a big problem.</div><div class="s"><b>Strong</b>Corruption persists in Pakistan largely because accountability institutions are not independent of the governments they are meant to check.</div></div>`,
  items:[
   {t:"mcq", q:"Topic: climate change. Which is the strongest topic sentence?", o:[
     "Climate change is a big problem in the world today.",
     "Pakistan contributes less than one per cent of global greenhouse gas emissions.",
     "Climate change threatens Pakistan's food security above all, because its agriculture depends on predictable water.",
     "In this paragraph I will discuss climate change."], a:2,
     why:"Option C names the topic and makes a focused claim (food security) with a reason. A is a cliché, B is a fact (good evidence, poor topic sentence), D is an announcement."},
   {t:"mcq", q:"Topic: women's empowerment. Pick the strongest topic sentence.", o:[
     "What is women's empowerment?",
     "Women make up about half of Pakistan's population.",
     "Women's empowerment has many aspects, causes, effects and solutions in every country.",
     "Economic independence is the surest route to women's empowerment in Pakistan, because it gives women a voice at home and in society."], a:3,
     why:"D has one controlling idea (economic independence) and a reason. A is a question, B is a bare fact, and C lists everything, so it controls nothing."},
   {t:"mcq", q:"Topic: social media. Pick the strongest topic sentence.", o:[
     "Social media has deepened political polarisation in Pakistan by rewarding outrage over evidence.",
     "Social media, which includes Facebook, X, TikTok, YouTube and Instagram, is used by many people.",
     "Is social media a blessing or a curse?",
     "Social media has good and bad effects."], a:0,
     why:"A makes a debatable claim and says how (rewarding outrage). B is description, C is a question, and D is too vague to argue."},
   {t:"mcq", q:"What is wrong with this topic sentence: \"Education is the backbone of a nation\"?", o:[
     "It is a cliché with no specific controlling idea.",
     "It is too narrow.",
     "It is a question.",
     "It is grammatically incorrect."], a:0,
     why:"Examiners read this line hundreds of times. It claims nothing specific about Pakistan or about education. Try: \"Pakistan cannot become a knowledge economy while 26 million of its children are out of school.\""},
   {t:"mcq", q:"Which sentence is a fact that belongs in the body, not a topic sentence?", o:[
     "Weak local government is the main reason basic services fail in Pakistan's cities.",
     "The 2023 census counted about 241 million people in Pakistan.",
     "Pakistan's population growth will cancel out its economic gains unless family planning becomes a national priority.",
     "Brain drain is costing Pakistan the very professionals it needs for reform."], a:1,
     why:"B can be checked but not argued, so it is evidence. A, C and D each take a position you would then have to prove."},
   {t:"write", q:"Write ONE topic sentence for each topic below (three sentences in all). Give each a clear controlling idea.", ctx:"1. Out-of-school children\n2. Population growth\n3. CPEC", short:false,
     task:"Write one topic sentence each for: (1) out-of-school children, (2) population growth, (3) CPEC.",
     focus:"topic sentences. For EACH of the three sentences: does it have a clear topic plus a specific, arguable controlling idea? Is it neither too broad nor too narrow? Is it free of clichés, announcements and questions?", max:9}
  ]},
{ id:2, title:"Supporting details", sub:"Explain the controlling idea",
  lede:"Support sentences answer the reader's question \"Why?\" or \"How?\" after your topic sentence.",
  lesson:`<h3>Support explains; it doesn't wander</h3>
  <p>After the topic sentence, add two or three sentences that <b>explain</b> the claim: reasons, causes, mechanisms, consequences. Every one must connect to the <b>controlling idea</b>, not just to the general topic.</p>
  <ul><li>Ask "why?" or "how?" about your topic sentence. The answers are your support.</li>
  <li>Move from general to specific: a reason, then how it works.</li>
  <li>Background facts ("X was founded in…") are not support unless they prove the claim.</li></ul>
  <div class="pair"><div class="w"><b>Off target</b>TS: Economic independence empowers women. → "Pakistan has many talented women cricketers."</div><div class="s"><b>On target</b>"A woman who earns her own income gains a say in decisions about her children's schooling, her health and her marriage."</div></div>`,
  items:[

{ id:3, title:"Examples & evidence", sub:"Prove it with specifics",
  lede:"A claim without evidence is opinion. CSS examiners reward specific, Pakistan-relevant proof.",
  lesson:`<h3>Four kinds of evidence</h3>
  <ul><li><b>Statistic:</b> "About 26 million children aged 5–16 are out of school."</li>
  <li><b>Case or event:</b> "The 2022 floods…"</li>
  <li><b>Authority or report:</b> "According to UNICEF…", "The Economic Survey notes…"</li>
  <li><b>Comparison:</b> "Unlike Bangladesh, which…"</li></ul>
  <p>Introduce evidence with a signal phrase (<i>For instance, A case in point is, According to</i>), then add <b>one sentence that explains what it proves</b>. Evidence never speaks for itself.</p>
  <div class="pair"><div class="w"><b>Vague</b>For example, everyone knows the floods were very bad.</div><div class="s"><b>Specific</b>A case in point is the 2022 floods, which affected about 33 million people and caused damage and losses estimated at over 30 billion dollars.</div></div>
  <p class="note">Check every figure against a current source (the Economic Survey, PBS, UNICEF, the World Bank) before the exam. Rounded and attributed numbers are safer than invented exact ones.</p>`,
  items:[
   {t:"mcq", q:"Claim: \"Pakistan is among the countries most vulnerable to climate change.\" Which is the best evidence?", o:[
     "Many people say the weather is changing.",
     "Climate change is often discussed at the United Nations.",
     "The 2022 floods affected about 33 million people and caused damage and losses estimated at over 30 billion dollars.",
     "Pakistan has four provinces and several territories."], a:2,
     why:"C is specific, attributable and directly shows vulnerability. A is hearsay, B is general, and D is irrelevant."},
   {t:"mcq", q:"Claim: \"Pakistan's tax base is too narrow to fund its development.\" Which evidence fits best?", o:[
     "Taxes are collected in most countries of the world.",
     "Pakistan's tax-to-GDP ratio has hovered around ten per cent, well below what most comparable developing economies collect.",
     "The Federal Board of Revenue has offices in many cities.",
     "Some people do not like paying taxes."], a:1,
     why:"B gives a measurable indicator and a comparison, which is what makes evidence persuasive."},
   {t:"mcq", q:"Why is this evidence weak? \"For example, everybody knows that corruption is everywhere.\"", o:[
     "It uses a signal phrase.",
     "It is too long.",
     "It is vague and unattributed: no case, figure or source.",
     "It is written in the passive voice."], a:2,
     why:"'Everybody knows' is an appeal to common opinion. Replace it with a case, a report (for example, Transparency International's Corruption Perceptions Index), or a documented example."},
   {t:"mcq", q:"After giving evidence, what should the next sentence normally do?", o:[
     "Start a new topic.",
     "Explain how the evidence proves the controlling idea.",
     "Repeat the evidence in different words.",
     "Ask the reader a question."], a:1,
     why:"This is the 'E' in PEEL: link the evidence back to the claim. Examiners call missing explanation 'dumping facts'."},

{ id:4, title:"Concluding sentences", sub:"Close the loop",
  lede:"The last sentence tells the examiner the point has been proved, and why it matters.",
  lesson:`<h3>Three good ways to end</h3>
  <ul><li><b>Restate in new words:</b> return to the controlling idea, but not word for word.</li>
  <li><b>Show significance:</b> so what? What follows if the claim is true?</li>
  <li><b>Link forward:</b> in an essay, point toward the next paragraph's idea.</li></ul>
  <p><b>Avoid:</b> introducing a new point, copying the topic sentence word for word, "In conclusion, as I said above…", or "That is all about…".</p>
  <div class="pair"><div class="w"><b>Weak</b>So, corruption is a big problem, as discussed above.</div><div class="s"><b>Strong</b>Without truly independent watchdogs, anti-corruption drives will remain slogans rather than reforms.</div></div>`,
  items:[
   {t:"mcq", q:"Choose the best concluding sentence for this paragraph.", ctx:"Climate change threatens Pakistan's food security above all. Its farms rely on glacier melt and monsoon rains, both now less predictable. Heatwaves in spring shrink wheat yields, while floods destroy standing crops. In 2022, millions of acres of cropland were submerged in Sindh alone. ______",
     o:["Climate change threatens Pakistan's food security above all.",
        "Unless Pakistan adapts its farming to an uncertain climate, its food security will remain at the mercy of the weather.",
        "Moreover, climate change also affects tourism in the north.",
        "That is all about climate change."], a:1,

        "Without truly independent watchdogs, anti-corruption drives will remain slogans rather than reforms.",
        "Accountability is a very wide topic."], a:2,

{ id:5, title:"Unity", sub:"Cut the sentence that strays",
  lede:"A unified paragraph proves ONE idea. One off-topic sentence costs marks under 'Unity & development'.",
  lesson:`<h3>The unity test</h3>
  <p>Hold each sentence against the <b>controlling idea</b>, not the broad topic, and ask: "Does this help prove that claim?" If not, it goes, however true or interesting it is.</p>
  <p>Exam candidates usually break unity in three ways: adding a related fact they happen to know, drifting into a solution when the paragraph is about causes, or adding a quotation that sounds impressive but proves nothing.</p>
  <p><b>In the drills below, click the sentence that breaks unity.</b></p>`,
  items:[
   {t:"spot", s:["Load-shedding is crippling Pakistan's small industries.","Textile workshops in Faisalabad lose hours of production whenever the power fails.","Owners must buy generators and diesel, which raises their costs sharply.","Pakistan's mountains include some of the highest peaks in the world.","As a result, many small firms can no longer compete with cheaper imports."], a:3,
     why:"The mountains are true but have nothing to do with load-shedding and industry."},
   {t:"spot", s:["Reading habits among Pakistani youth are declining.","Many students now spend more hours on short videos than on books.","Allama Iqbal was born in Sialkot in 1877.","Public libraries in many towns are poorly stocked and rarely visited.","Even university students often read only what the syllabus demands."], a:2,
     why:"Iqbal's birth is a 'famous fact' dropped in. It does not show that reading is declining."},
   {t:"spot", s:["Local government is essential for effective service delivery.","Local councillors know which streets need drains and which schools need teachers.","Citizens can hold a councillor to account far more easily than a distant minister.","The National Assembly debates the federal budget every June.","When local bodies are suspended, these decisions return to provincial departments far from the problem."], a:3,
     why:"The federal budget debate concerns the national level. It does not explain why local government matters for services."},
   {t:"spot", s:["Social media has deepened political polarisation in Pakistan.","Its algorithms reward posts that provoke anger, so the angriest voices travel furthest.","Supporters of each party increasingly see only content that confirms their views.","The government should launch digital literacy programmes in every school.","As a result, compromise now looks like betrayal to many voters."], a:3,
     why:"This is a solution sentence inside a paragraph about causes and effects. Save it for the solutions section of your essay."}
  ]},
{ id:6, title:"Coherence", sub:"Transitions and logical order",
  lede:"Coherence is how smoothly the reader moves from one sentence to the next: the right linking words in the right order.",
  lesson:`<h3>Transitions by job</h3>
  <ul><li><b>Addition:</b> moreover, furthermore, in addition</li>
  <li><b>Contrast:</b> however, by contrast, nevertheless, yet</li>
  <li><b>Cause and effect:</b> therefore, consequently, as a result, thus</li>
  <li><b>Example:</b> for instance, a case in point is</li>
  <li><b>Sequence and conclusion:</b> first, then, ultimately</li></ul>
  <p>Coherence also comes from <b>repeating key terms</b> and <b>pronouns</b> that point back clearly ("this policy", "such shocks"). Do not overuse transitions: one in every sentence reads as mechanical.</p>
  <p>Logical order: claim → explanation → evidence → consequence → link.</p>`,
  items:[
   {t:"fill", q:"Choose the right transition for each gap.", parts:["Pakistan has one of the youngest populations in the world. ","{0}",", this could become a demographic dividend. ","{1}",", without education and jobs, it may turn into a burden. ","{2}",", investment in skills is urgent."],
     choices:["However","Therefore","In theory","For instance","Moreover"], a:["In theory","However","Therefore"],
     why:"'In theory' sets up a possibility, 'However' turns to the risk, and 'Therefore' draws the conclusion."},
   {t:"fill", q:"Choose the right transition for each gap.", parts:["Most farmers in Sindh still use flood irrigation. ","{0}",", a large share of canal water is lost before it reaches crops. ","{1}",", drip and sprinkler systems deliver water directly to the roots. ","{2}",", the province should subsidise efficient irrigation."],
     choices:["As a result","By contrast","Thus","For example","Furthermore"], a:["As a result","By contrast","Thus"],
     why:"Cause → effect (As a result), alternative (By contrast), conclusion (Thus)."},
   {t:"order", q:"Put these sentences in the most logical order. Click them one by one.", s:[
     "Accountability fails in Pakistan mainly because watchdog institutions are not independent.",
     "Their heads are often appointed and removed by the very governments they are supposed to investigate.",
     "As a result, cases against ruling parties stall, while cases against opponents move quickly.",
     "This selective justice has damaged public trust in the whole process.",
     "Real reform, therefore, must begin by shielding these institutions from political control."],
     why:"Claim → cause → consequence ('As a result') → wider effect ('This selective justice') → link ('therefore'). The pronouns and transitions are the clues."},
   {t:"order", q:"Put these sentences in the most logical order.", s:[
     "Climate change is turning water security into Pakistan's most urgent national challenge.",
     "Its rivers depend on glaciers and monsoon rains, both of which are becoming less predictable.",
     "For instance, the 2022 floods followed an extreme monsoon, while other years bring severe drought.",
     "Such swings damage crops, homes and infrastructure alike.",
     "Unless storage and water management improve, these shocks will keep reversing development gains."],
     why:"Topic sentence → explanation → example ('For instance') → consequence ('Such swings') → concluding link ('Unless…')."}
  ]},
{ id:7, title:"Build a PEEL paragraph", sub:"Put it all together",
  lede:"Now build a full 150–220 word paragraph, one part at a time. The preview assembles it as you write.",
  lesson:`<h3>PEEL</h3>
  <div class="formula"><b>P</b>oint → <b>E</b>xplain → <b>E</b>vidence / Example → <b>L</b>ink</div>
  <ul><li><b>Point:</b> one topic sentence with a clear controlling idea (Ex 1).</li>
  <li><b>Explain:</b> two or three sentences on why or how (Ex 2).</li>
  <li><b>Evidence:</b> a specific figure, case or report, plus what it proves (Ex 3).</li>
  <li><b>Link:</b> a concluding sentence that closes the point or leads on (Ex 4).</li></ul>
  <p>Then check unity (Ex 5) and transitions (Ex 6). It is marked out of 20 on the Workshop rubric: topic sentence, unity and development, evidence and example, coherence, and language accuracy, at 4 marks each.</p>`,
  items:[{t:"peel"}]},
{ id:8, title:"Timed paragraph", sub:"Exam conditions",
  lede:"Exam conditions: one topic, 20 minutes, 180–250 words, no notes. Plan for 3 minutes, write for 14, revise for 3.",
  lesson:`<h3>Exam routine</h3>
  <ol class="steps"><li>Read the topic and decide your stance in one line.</li>
  <li>Jot P–E–E–L in the margin: four or five words each.</li>
  <li>Write. Start with the topic sentence and do not stop to polish.</li>
  <li>Spend the last three minutes on revision: articles, subject–verb agreement, tenses, one clear transition per idea.</li></ol>
  <p>Score 15 or more out of 20 consistently here, and you're ready to start full essays.</p>`,
  items:[{t:"timed"}]}
];

  ["A healthy society rests not only on its government but on the countless associations that citizens form among themselves.","Trade unions, mosque committees, parent–teacher bodies, neighbourhood welfare groups and bar councils all occupy the ground between the household and the state.","This ground, which scholars call civil society, is where people learn the habits of self-government long before they cast a vote.","A farmer who helps run a water users' association learns to keep accounts, settle disputes and answer to his fellows; these are the same virtues that a parliament demands of its members."],

function idiomMcq(i){
  const [id, m] = IDIOMS[i];
  const pool = IDIOMS.map(x=>x[1]).filter(x=>x!==m);
  const pick = seededShuffle(pool, i*13+5).slice(0,3).map(k=>pool[k]);
  const pos = (i*7)%4; const o = pick.slice(); o.splice(pos,0,m);
  return {t:"mcq", q:"\""+id+"\" means:", o, a:pos, why:id+": "+m+"."};
}

{ id:9, group:"comp", title:"Comprehension", sub:"20 marks · 5 questions",
  lede:"Read once for the gist, then once for detail. Answer in your own words, two to four sentences each, and lift no full sentences from the passage.",
  lesson:`<h3>How the comprehension question works</h3>
  <p>CSS sets one passage of about 400–500 words with five questions of 4 marks each (2022: civil society; 2023: voluntary simplicity; 2026: a woman's dreams of luxury). The passages below are <b>originals written in the same style and on those themes</b>, because the past-paper passages are copyrighted extracts.</p>
  <ul><li><b>Locate:</b> underline the sentence that each question points to. The answer is almost always in one or two sentences.</li>
  <li><b>Rephrase:</b> examiners deduct marks for copying. Change the structure as well as the words.</li>
  <li><b>"Explain the line" questions:</b> give its literal meaning, then what it means in context.</li>
  <li><b>Vocabulary in context:</b> give the meaning the word has <i>here</i>, not its dictionary meaning.</li></ul>`,
  items:[
   {t:"comp", p:"civil", qs:[
    {q:"What does the author mean by 'civil society'?", m:"Civil society is the network of voluntary associations, such as unions, committees, welfare groups and bar councils, that occupies the space between the family and the state."},
    {q:"How does a water users' association prepare citizens for democracy?", m:"By running it, ordinary people practise keeping accounts, resolving disputes and being answerable to others, which are the same qualities a parliament requires of its members."},
    {q:"What two dangers threaten civil society?", m:"First, a suspicious state may ban associations or deny them registration and funds. Second, where the state is absent, powerful individuals may take them over for their own ends."},
    {q:"Why, according to the author, are numbers alone not enough?", m:"Many organisations are empty shells that survive on foreign grants or official favour. Real strength comes from associations that are voluntary, accountable and able to cooperate across class, sect and language."},
    {q:"Explain: 'isolation breeds either apathy or rage.'", m:"Citizens who are denied collective action either lose interest in public life altogether or, having no peaceful outlet, turn their frustration into anger and unrest."}]},
   {t:"mcq", q:"In the passage, 'quietly starved of registration and funds' means the associations are…", o:["openly banned by law","slowly weakened by being denied what they need","fed by the government","forced to merge"], a:1, why:"'Starved' is figurative: they are not banned outright but are denied registration and money until they wither."},
   {t:"mcq", q:"'Letterhead bodies' (para 3) are organisations that…", o:["print official newspapers","exist mainly on paper, with little real activity","are led by educated people","work only in letters and journalism"], a:1, why:"The contrast with 'genuine associations' shows they exist in name only."},
   {t:"comp", p:"simple", qs:[
    {q:"How has advertising changed, according to the passage?", m:"Instead of selling products, advertising now sells identities, promising admiration, calm or youth. Because the promise is never fulfilled, people must keep buying."},
    {q:"Who practise voluntary simplicity, and who do not count?", m:"It is practised mainly by people who could afford more but choose to own less. It does not include ascetics who reject comfort, or the poor, who have no choice."},
    {q:"What is the critics' objection, and how does the author answer it?", m:"Critics call simplicity a luxury of the well-off. The author partly agrees, but argues that the well-off cause most of the waste, debt and pollution that hurt the poor, so their restraint would bring real material benefits."},
    {q:"Explain: 'the argument cuts both ways.'", m:"The fact that simplicity concerns the comfortable, which critics use against it, also shows why it matters: the comfortable are exactly the people whose consumption must change."},
    {q:"Suggest a suitable title and explain the last sentence.", m:"Title: 'The Freedom of Wanting Less'. The last sentence means that simplicity is not withdrawal from life but a deliberate choice of what is worth our time and attention."}]},
   {t:"mcq", q:"'Making a virtue of necessity' (para 2) means…", o:["praising a limitation one cannot avoid","becoming virtuous through hardship","doing what is necessary for virtue","rejecting wealth on principle"], a:0, why:"It means presenting something you are forced into as if it were a noble choice, as the poor might do with owning little."}
  ]},
{ id:10, group:"comp", title:"Précis", sub:"20 marks · find the relevant data",
  lede:"A précis keeps the argument and drops the decoration. First learn to sort sentences, then write the précis in about one-third of the words.",
  lesson:`<h3>The précis method</h3>
  <ol class="steps"><li>Read twice. Write the central idea in one line: this becomes your title and first sentence.</li>
  <li><b>Sort every sentence:</b> <b>Main</b> (a step in the argument, so keep it), <b>Support</b> (compress it into a phrase), or <b>Cut</b> (an example, illustration, quotation, repetition or rhetorical flourish).</li>
  <li>Write about one-third of the original length, in your own words, in the third person and the past or present tense. Add no opinion.</li>
  <li>Give a short, precise title that names the central idea, not just the topic.</li></ol>
  <p>CSS passages have covered education and freedom (2023), ancient oracles (2022) and labour welfare (2026). The two passages here are originals on those themes.</p>`,
  items:[
   {t:"tag", p:"edu"},
   {t:"mcq", q:"Best title for Passage A?", o:["Education","Problems of Our Examination System","Education for Free Minds","Students and Teachers"], a:2, why:"It names the central idea (education's purpose is mental freedom). A is only the topic, B covers one paragraph, and D is vague."},
   {t:"precis", p:"edu"},
   {t:"tag", p:"labour"},
   {t:"mcq", q:"Best title for Passage B?", o:["The Industrial Revolution","Partners, Not Enemies","Child Labour in England","The Gig Economy"], a:1, why:"The central idea is the interdependence of employers and workers, then and now. The others name single parts of the passage."},
   {t:"precis", p:"labour"}
  ]},
{ id:11, group:"comp", title:"Synonyms & antonyms", sub:"20 MCQs in the paper",
  lede:"Part I of the paper is 20 one-mark MCQs. These are the real words from CSS 2026, 2023 and 2022.",
  lesson:`<h3>How to prepare</h3>
  <ul><li>Words repeat across years, and 'Panacea' appeared in both 2023 and 2026. Keep a notebook of every past-paper word with its meaning and one example sentence.</li>
  <li>Use roots: <i>bene-</i> (good) → benign; <i>mal-</i> (bad) → malicious; <i>-phony</i> (sound) → cacophony; <i>pro-/re-</i> patterns.</li>
  <li>For antonyms, first decide the word's meaning, then find its opposite. Distractors often include a <b>synonym</b> to trap you (for example, Candour → 'Candidness').</li>
  <li>There is no negative marking in CSS MCQs, so never leave one blank.</li></ul>
  <p class="note">The 2026 items use the options as printed in the paper. For 2023 and 2022 the words are from the papers, but I wrote the options.</p>`,
  items:[].concat(
    SYN26.map(([w,o,a])=>synItem(w,o,a,"syn","2026")),
    ANT26.map(([w,o,a])=>synItem(w,o,a,"ant","2026")),
    SYN_OLD.map(([w,y,m,o])=>{ const it = synItem(w,o,o.findIndex(x=>m.includes(x)),"syn",y); it.why = w+" means "+m+"."; return it; }),
    ANT_OLD.map(([w,y,m,ans,o])=>{ const it = synItem(w,o,o.indexOf(ans),"ant",y); it.why = w+" ("+m+") ↔ "+ans+"."; return it; })
  )},
{ id:12, group:"comp", title:"Pairs of words", sub:"10 marks · use 5 of 8",
  lede:"You are given eight confusable pairs and must use five in sentences that clearly show the difference. These pairs are from CSS 2026, 2023 and 2022.",
  lesson:`<h3>How to score full marks</h3>
  <p>Write <b>one sentence for each word</b>, so two per pair, and make the context show the meaning unmistakably. "He is eminent" earns little; "Dr Abdus Salam was an eminent physicist" earns full marks.</p>
  <div class="pair"><div class="w"><b>Weak</b>I got a compliment. The colours complement.</div><div class="s"><b>Strong</b>The examiner paid her a compliment on her clear handwriting. / A good title should complement the précis, not repeat it.</div></div>
  <p class="subl">Reference list</p>
  <div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:14px;min-width:420px">${PAIRS.map(p=>`<tr><td style="padding:6px 10px 6px 0;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap">${p[0]}</td><td style="padding:6px 0;border-bottom:1px solid var(--line)">${p[1]}</td></tr>`).join("")}</table></div>`,
  items:[].concat(
    PAIRS.map(p=>({t:"mcq", q:"Fill the blank: "+p[2], o:p[4], a:p[4].indexOf(p[3]), why:p[0]+": "+p[1]+"."})),
    [{t:"write", q:"Use any FIVE pairs from the list above in sentences that show the difference (ten sentences in all).", task:"Use five pairs of confusable words in sentences (two sentences per pair) that clearly show the difference in meaning, as in the CSS English paper.", focus:"pairs of words. For each pair: is each word used correctly, and does the sentence context make its meaning unmistakable? Are the sentences grammatically correct? Score 2 marks per pair.", max:10}]
  )},
{ id:13, group:"comp", title:"Idioms & phrases", sub:"Meaning + use in a sentence",
  lede:"Older CSS papers and PMS papers ask you to use idioms in sentences. They also show up in the translation question and lift an essay when used sparingly.",
  lesson:`<h3>Using an idiom well</h3>
  <p>The sentence must show that you understand the meaning. It is not enough to place the idiom correctly.</p>
  <div class="pair"><div class="w"><b>Weak</b>The motorway is a white elephant.</div><div class="s"><b>Strong</b>The airport, built at great cost but used by only two flights a week, has become a white elephant for the provincial government.</div></div>
  <p>In an essay, use at most one or two idioms. Never use an idiom you are unsure of: one wrong idiom costs more than a plain sentence.</p>
  <p class="note">These are classic exam idioms that recur in CSS and PMS papers and guidebooks. Recent CSS papers (2022–2026) test idioms mainly through translation.</p>`,
  items:[].concat(IDIOMS.map((x,i)=>idiomMcq(i)),
    [{t:"write", q:"Use any FIVE idioms from this exercise in sentences of your own that make the meaning clear.", task:"Use five English idioms in original sentences that make their meaning clear.", focus:"use of idioms. For each sentence: is the idiom's form exact (wording, articles, prepositions), is its meaning shown clearly by the context, and is the sentence grammatical? 2 marks per idiom.", max:10}])},
{ id:14, group:"comp", title:"Sentence correction", sub:"10 marks · correct 5 of 8",
  lede:"These are the actual sentences from CSS 2023 and 2022. Write your correction, check it against the key, then mark yourself honestly.",
  lesson:`<h3>What examiners plant in these sentences</h3>
  <ul><li><b>Subject–verb agreement:</b> 'His knowledge … <i>aids</i>'; 'The ambassador, with his staff, <i>invites</i>'.</li>
  <li><b>Tense sequence:</b> a past main clause takes a past subordinate clause.</li>
  <li><b>Pronoun case:</b> 'Aslam and <i>I</i> plan'.</li>
  <li><b>Indirect question word order:</b> 'what the salary <i>was</i>', not 'what is the salary'.</li>
  <li><b>Correlatives:</b> 'so … that', not 'too … that'.</li>
  <li><b>Articles and prepositions:</b> '<i>the</i> guitar', 'smiled <i>at</i> me', 'sit <i>for</i> an examination'.</li></ul>
  <p>Rewrite the <b>whole</b> sentence in the exam, and change only what is wrong.</p>`,
  items:[
   {t:"correct", y:"2023", s:"His knowledge of languages and international relations aid him in his work.", a:"His knowledge of languages and international relations aids him in his work.", why:"The subject is 'knowledge' (singular). 'Languages and international relations' sit inside the prepositional phrase."},
   {t:"correct", y:"2023", s:"The ambassador, with his family and staff, invite you to a reception at the embassy on Tuesday afternoon.", a:"The ambassador, with his family and staff, invites you to a reception at the embassy on Tuesday afternoon.", why:"A phrase beginning 'with' or 'along with' does not make the subject plural."},
   {t:"correct", y:"2023", s:"This year, he will sit in the CSS examination.", a:"This year, he will sit for the CSS examination.", why:"The idiom is 'sit for an examination' (or 'take')."},
   {t:"correct", y:"2023", s:"The Chief Executive will let us know whether or not he can attend the meeting.", a:"The Chief Executive will let us know whether he can attend the meeting.", why:"'Whether' already includes the alternative, so 'or not' is redundant here."},
   {t:"correct", y:"2023", s:"When he came back from vacation, Aslam and me plan to look for another apartment.", a:"When he came back from vacation, Aslam and I planned to look for another apartment.", why:"Use the subject pronoun 'I', and keep the tense consistent: came → planned."},
   {t:"correct", y:"2023", s:"If some of you make a noise, they shall be punished.", a:"If any of you makes a noise, you will be punished.", why:"In a conditional use 'any', not 'some'. The pronoun must refer back to 'you', not 'they', and 'will' is the normal future here."},
   {t:"correct", y:"2023", s:"He came to me to enquire what is the salary attached to the appointment.", a:"He came to me to enquire what the salary attached to the appointment was.", why:"An indirect question uses statement word order (subject before verb), and the past reporting verb takes a past tense."},
   {t:"correct", y:"2023", s:"I am too tired that I do not hunt words and idioms in my English book.", a:"I am so tired that I cannot hunt for words and idioms in my English book.", why:"Use 'so … that' (or 'too tired to hunt'). 'Hunt for' takes a preposition."},
   {t:"correct", y:"2022", s:"I must walk two miles to school every morning when I was a child.", a:"I had to walk two miles to school every morning when I was a child.", why:"'Must' has no past form. Use 'had to' for past obligation."},
   {t:"correct", y:"2022", s:"After the storm, we had got to pick up some fallen branches.", a:"After the storm, we had to pick up some fallen branches.", why:"The simple past 'had to' fits. 'Had got to' is a wrong tense here."},
   {t:"correct", y:"2022", s:"Guitar is most popular instrument among teen age boys, but not girls.", a:"The guitar is the most popular instrument among teenage boys, but not among girls.", why:"'The' for a musical instrument, 'the' with a superlative, 'teenage' as one word, and a parallel 'among girls'."},
   {t:"correct", y:"2022", s:"You are not well and I wish you feel better soon.", a:"You are not well, and I hope you feel better soon.", why:"'Hope' for something possible in the future. 'Wish' is used for unreal situations."},
   {t:"correct", y:"2022", s:"The grass not looking green now because it is not raining since last month.", a:"The grass is not looking green now because it has not rained since last month.", why:"The auxiliary 'is' is missing, and 'since last month' needs the present perfect."},
   {t:"correct", y:"2022", s:"The cold air made me shiver a little when I was waiting for him.", a:"The cold air made me shiver a little while I was waiting for him.", why:"'While' for an action in progress during the main event."},
   {t:"correct", y:"2022", s:"I offered my seat to an older woman who just smiled me.", a:"I offered my seat to an older woman, who just smiled at me.", why:"'Smile at someone'. A comma is natural before a non-defining clause."},
   {t:"correct", y:"2022", s:"She packed her bags, carried downstairs and put the back seat of her car.", a:"She packed her bags, carried them downstairs and put them on the back seat of her car.", why:"'Carried' and 'put' need objects ('them'), and 'put … on the back seat' needs a preposition."}
  ]},
{ id:15, group:"comp", title:"Prepositions", sub:"5 marks · fill and rewrite",
  lede:"These are the real items from CSS 2023 and 2022. Type the preposition; some blanks accept more than one answer.",
  lesson:`<h3>Prepositions are learned as phrases, not rules</h3>
  <p>Learn them in fixed combinations: <i>good at, of one's own accord, under the weather, up to something, enter into an agreement, trip over, in ruins</i>. When you meet a new one, write the whole phrase in your notebook.</p>`,
  items:[
   {t:"prep", y:"2023", s:"The neighbours came ___ my house to see what was going on.", a:["to","over to","round to","into"], why:"'Came to/over to my house'."},
   {t:"prep", y:"2023", s:"She sat ___ the shade of the tree.", a:["in"], why:"'In the shade'. 'Under' goes with the tree itself: 'under the tree'."},
   {t:"prep", y:"2023", s:"The moon does not shine ___ its own light.", a:["by","with"], why:"'By its own light' or 'with its own light'. The moon reflects the sun's light."},
   {t:"prep", y:"2023", s:"The burglar jumped ___ the compound wall.", a:["over"], why:"'Jump over' a wall."},
   {t:"prep", y:"2023", s:"She entered ___ an agreement with them.", a:["into"], why:"'Enter into an agreement, a contract or a discussion'. 'Enter a room' takes no preposition."},
   {t:"prep", y:"2023", s:"I have been working hard ___ arithmetic.", a:["at","on"], why:"'Work hard at a subject', or 'work on' it."},
   {t:"prep", y:"2023", s:"He got ___ his bicycle.", a:["on","off"], why:"'Get on' (mount) or 'get off' (dismount) a bicycle."},
   {t:"prep", y:"2023", s:"It cannot be done ___ offence.", a:["without"], why:"'Without (giving) offence'."},
   {t:"prep", y:"2022", s:"Despite regular practice he never seems to win ___ tennis.", a:["at"], why:"'Win at a game'."},
   {t:"prep", y:"2022", s:"___ luck, we should be in Islamabad by 5 p.m.", a:["with"], why:"'With luck' means if things go well."},
   {t:"prep", y:"2022", s:"He went ___ his own accord: nobody forced him to go.", a:["of"], why:"'Of one's own accord' means voluntarily."},
   {t:"prep", y:"2022", s:"My husband brought me some flowers today. He must be ___ something!", a:["up to"], why:"'Up to something' means planning something secretly."},
   {t:"prep", y:"2022", s:"My younger son tripped ___ the cat and fell downstairs.", a:["over"], why:"'Trip over' an obstacle."},
   {t:"prep", y:"2022", s:"You look really ___ the weather. Are you ill?", a:["under"], why:"'Under the weather' means slightly unwell."},
   {t:"prep", y:"2022", s:"The car went ___ the brow of the hill and was soon out of sight.", a:["over"], why:"'Over the brow of the hill'."},
   {t:"prep", y:"2022", s:"He said that his career was ___ ruins because of the pandemic.", a:["in"], why:"'In ruins'. (The paper's 'He told that' is itself an error: use 'He said that'.)"}
  ]}
);

{ id:16, group:"gram", title:"Sentence boundaries", sub:"Fragments, run-ons, comma splices",
  lede:"The most common structural error in exam scripts, and the one in your own CPEC sentence: two sentences glued together with a comma, or half a sentence standing alone.",
  lesson:`<h3>What makes a sentence</h3>
  <div class="formula">Subject + finite verb + a complete thought</div>
  <ul><li><b>Fragment:</b> "Because the floods destroyed the crops." There is a subject and a verb, but the thought is incomplete.</li>
  <li><b>Run-on:</b> "Education is important it builds nations." Two sentences with nothing between them.</li>
  <li><b>Comma splice:</b> "CPEC began in 2015, it has not delivered." A comma cannot join two full sentences.</li></ul>
  <p><b>Five ways to fix a comma splice:</b></p>
  <ul><li>Full stop: "…in 2015. It has not…"</li>
  <li>Semicolon: "…in 2015; it has not…"</li>
  <li>Comma + and / but / so / yet / or: "…in 2015, but it has not…"</li>
  <li>Subordinator: "<i>Although</i> CPEC began in 2015, it has not…"</li>
  <li>Semicolon + connective + comma: "…in 2015; <i>however,</i> it has not…"</li></ul>
  <p class="note">However, therefore, moreover and consequently are adverbs, not conjunctions, so they can never join two sentences with only a comma.</p>`,
  items:[
   {t:"mcq", q:"Which sentence is a comma splice?", o:["Although prices rose, wages stayed flat.","Prices rose, wages stayed flat.","Prices rose, but wages stayed flat.","Prices rose; wages stayed flat."], a:1, why:"B joins two complete sentences with only a comma. The others use a subordinator, a comma + conjunction, or a semicolon."},
   {t:"mcq", q:"What is wrong with: \"Pakistan imports oil, however, its own reserves are untapped.\"", o:["Nothing","'However' cannot join two sentences with commas; use '; however,'","'Oil' needs an article","'Untapped' should be 'untapping'"], a:1, why:"Correct: \"Pakistan imports oil; however, its own reserves are untapped.\""},
   {t:"mcq", q:"Which is a fragment?", o:["The government announced a new policy.","Although the government announced a new policy.","The government announced a new policy, but nothing changed.","Nothing changed after the announcement."], a:1, why:"'Although' makes the clause dependent: although it did, what happened? It needs a main clause."},
   {t:"mcq", q:"Best correction of: \"The floods destroyed the crops, prices rose sharply.\"", o:["The floods destroyed the crops prices rose sharply.","The floods destroyed the crops, and, prices rose sharply.","The floods destroyed the crops, so prices rose sharply.","The floods destroyed the crops however prices rose sharply."], a:2, why:"A comma + 'so' joins the clauses and shows cause and effect."},
   {t:"correct", s:"CPEC was started in 2015, it is almost eleven years passed but the results are yet to come.", a:"CPEC was launched in 2015; almost eleven years have passed, but the promised results have yet to arrive.", why:"This is your own sentence. Fix the comma splice with a semicolon, and change 'it is … passed' to the present perfect 'have passed'."},
   {t:"correct", s:"Education is important it builds a nation.", a:"Education is important because it builds a nation.", why:"A run-on. Join the clauses with 'because', a semicolon or a full stop."},
   {t:"correct", s:"Because the population is growing rapidly. The demand for water has increased.", a:"Because the population is growing rapidly, the demand for water has increased.", why:"The first part is a fragment. Attach it to the main clause with a comma."},
   {t:"correct", s:"The government raised taxes, people protested, the decision was withdrawn.", a:"The government raised taxes, but after people protested, the decision was withdrawn.", why:"Three sentences spliced together. Show the logic with 'but' and 'after'."},
   {t:"correct", s:"Many children work in hotels. Instead of going to school. Their parents need the money.", a:"Many children work in hotels instead of going to school because their parents need the money.", why:"'Instead of going to school' is a fragment. Join everything into one sentence."}
  ]},
{ id:17, group:"gram", title:"Subject–verb agreement", sub:"Find the real subject",
  lede:"Examiners plant agreement errors in nearly every sentence-correction question. The trick is finding the real subject.",
  lesson:`<h3>Rules that catch candidates</h3>
  <ul><li><b>Ignore the phrase in between:</b> "The <i>quality</i> of government schools <b>is</b> declining."</li>
  <li><b>along with / as well as / with</b> do not add to the subject: "The minister, along with his staff, <b>was</b> present."</li>
  <li><b>each, every, everyone, either, neither</b> are singular: "Each of the provinces <b>has</b>…"</li>
  <li><b>either…or / neither…nor:</b> the verb agrees with the nearer subject: "Neither the minister nor his advisers <b>were</b>…"</li>
  <li><b>the number of</b> takes a singular verb; <b>a number of</b> takes a plural: "The number of girls <b>has</b> risen; a number of NGOs <b>have</b> opened schools."</li>
  <li><b>one of the + plural noun + who/that:</b> the verb agrees with the plural noun: "one of those officers who <b>have</b> never taken a bribe."</li>
  <li><b>Uncountable and -ics nouns</b> are singular: news, information, advice, economics, politics (as a subject).</li></ul>`,
  items:[
   {t:"fill", q:"Choose the correct verb for each gap.", parts:["The quality of government schools ","{0}"," declining. One of the main reasons ","{1}"," the shortage of trained teachers. There ","{2}"," also many schools without boundary walls."], choices:["is","are"], a:["is","is","are"], why:"The subjects are quality (singular), one (singular) and many schools (plural)."},
   {t:"fill", q:"Choose the correct verb for each gap.", parts:["Each of the provinces ","{0}"," its own education department. The number of out-of-school girls ","{1}"," risen, while a number of NGOs ","{2}"," opened community schools."], choices:["has","have"], a:["has","has","have"], why:"Each takes a singular verb, 'the number of' is singular, and 'a number of' is plural."},
   {t:"fill", q:"Choose the correct verb for each gap.", parts:["Neither the minister nor his advisers ","{0}"," present. The committee, along with its chairman, ","{1}"," criticised in the press. Bread and butter ","{2}"," his only breakfast."], choices:["was","were"], a:["were","was","was"], why:"The verb agrees with the nearer subject (advisers). 'Along with' adds nothing to the subject. 'Bread and butter' is one dish."},
   {t:"mcq", q:"The news from the flood-hit districts ___ alarming.", o:["are","is","were","have been"], a:1, why:"'News' is uncountable and takes a singular verb."},
   {t:"correct", s:"The standard of education in rural areas are very low.", a:"The standard of education in rural areas is very low.", why:"The subject is 'standard' (singular)."},
   {t:"correct", s:"Every one of the candidates have submitted their forms.", a:"Every one of the candidates has submitted his or her form.", why:"'Every one' is singular, so the verb and the pronoun are singular too."},
   {t:"correct", s:"He is one of those officers who has never taken a bribe.", a:"He is one of those officers who have never taken a bribe.", why:"'Who' refers to 'officers' (plural), not to 'one'."},
   {t:"correct", s:"His knowledge of languages and economics help him a lot.", a:"His knowledge of languages and economics helps him a great deal.", why:"The subject is 'knowledge'. This is the same trap as CSS 2023."}
  ]},
{ id:18, group:"gram", title:"Tenses", sub:"Present perfect & sequence",
  lede:"Your 'it is almost eleven years passed' was a tense error. Most tense mistakes in essays come from three rules.",
  lesson:`<h3>Three rules</h3>
  <ol class="steps"><li><b>Present perfect</b> (have/has + V3) for a period that continues to now: <i>since 2015, for eleven years, so far, yet, already, recently</i>. "Almost eleven years <b>have passed</b>."</li>
  <li><b>Simple past</b> for a finished time: <i>in 2015, yesterday, ago, last year</i>. Never "has won in 1992".</li>
  <li><b>Sequence of tenses:</b> after a past reporting verb, the next clause also moves to the past: "He said that he <b>was</b> tired." The exception is universal truths: "The teacher said that the earth <b>moves</b> round the sun."</li></ol>
  <p><b>since</b> + a point in time (since 2010) · <b>for</b> + a length of time (for eight years) · <b>ago</b> + simple past (three years ago).</p>
  <p><b>Conditionals:</b> no "will" in the if-clause: "If he <b>works</b> hard, he will pass."</p>`,
  items:[
   {t:"fill", q:"Choose the right verb form for each gap.", parts:["CPEC ","{0}"," in 2015. Since then, almost eleven years ","{1}",", and the project ","{2}"," roads and power plants, but few industrial jobs."], choices:["was launched","has been launched","have passed","passed","has delivered","delivered"], a:["was launched","have passed","has delivered"], why:"'In 2015' is a finished time, so simple past. 'Since then' runs up to now, so present perfect."},
   {t:"fill", q:"Choose since, for or ago.", parts:["He has lived in Hyderabad ","{0}"," 2010. He has taught at the university ","{1}"," eight years. He started his PhD three years ","{2}","."], choices:["since","for","ago"], a:["since","for","ago"], why:"Since + a point, for + a period, ago + simple past."},
   {t:"mcq", q:"I ___ the Vice Chancellor yesterday.", o:["have met","met","have been meeting","had met"], a:1, why:"'Yesterday' is a finished time, so simple past."},
   {t:"mcq", q:"He said that he ___ tired.", o:["is","was","has been","will be"], a:1, why:"A past reporting verb moves the next clause back into the past."},
   {t:"mcq", q:"Our teacher told us that the earth ___ round the sun.", o:["moved","moves","had moved","was moving"], a:1, why:"A universal truth stays in the present, even after a past reporting verb."},
   {t:"correct", s:"I am living in Hyderabad since 2010.", a:"I have been living in Hyderabad since 2010.", why:"'Since' needs the present perfect (continuous), not the present continuous."},
   {t:"correct", s:"Pakistan has won the Cricket World Cup in 1992.", a:"Pakistan won the Cricket World Cup in 1992.", why:"A definite past time ('in 1992') takes the simple past."},
   {t:"correct", s:"When I reached the station, the train already left.", a:"When I reached the station, the train had already left.", why:"Use the past perfect for the earlier of two past actions."},
   {t:"correct", s:"If he will work hard, he will pass the examination.", a:"If he works hard, he will pass the examination.", why:"First conditional: present tense in the if-clause."},
   {t:"correct", s:"It is not raining since last month.", a:"It has not rained since last month.", why:"'Since' needs the present perfect. This is from CSS 2022."}
  ]},
{ id:19, group:"gram", title:"Articles", sub:"a, an, the, or nothing",
  lede:"Articles are the error examiners notice first, and there is no equivalent in Sindhi or Urdu. Learn the rules once and check every noun.",
  lesson:`<h3>The rules that matter in exam writing</h3>
  <ul><li><b>a / an:</b> a singular countable noun, mentioned for the first time or in general. Choose by <i>sound</i>: an hour, an MPhil, an SP; a university, a European, a one-day match.</li>
  <li><b>the:</b> something specific or already mentioned; unique things (the sun, the world); superlatives (the most…); ordinals (the first); rivers, seas and mountain ranges (the Indus, the Arabian Sea, the Himalayas); musical instruments (plays the guitar); countries with "Republic", "Kingdom" or plural names (the UK, the United States).</li>
  <li><b>No article:</b> abstract or uncountable nouns used in general (<i>Education is</i>… <i>Poverty causes crime</i>); plural nouns in general (<i>Children need</i>…); most countries, cities and languages (Pakistan, Sindhi); games (plays cricket); meals (at lunch).</li></ul>`,
  items:[
   {t:"fill", q:"Choose a, an, the, or — (no article).", parts:["","{0}"," Indus is ","{1}"," longest river in Pakistan. It is ","{2}"," important source of water for ","{3}"," agriculture."], choices:["a","an","the","—"], a:["the","the","an","—"], why:"Rivers take 'the'; superlatives take 'the'; 'an important' (vowel sound); agriculture in general takes no article."},
   {t:"fill", q:"Choose a, an, the, or — (no article).", parts:["He is ","{0}"," honest officer and ","{1}"," university lecturer. He plays ","{2}"," flute but dislikes ","{3}"," cricket."], choices:["a","an","the","—"], a:["an","a","the","—"], why:"'An honest' (silent h); 'a university' (a 'yoo' sound); instruments take 'the'; games take no article."},
   {t:"mcq", q:"___ education is the right of every child.", o:["The","An","A","No article"], a:3, why:"An abstract noun used in general takes no article."},
   {t:"mcq", q:"She has completed ___ MPhil in linguistics.", o:["a","an","the","no article"], a:1, why:"MPhil is pronounced 'em-fil', which begins with a vowel sound, so 'an'."},
   {t:"correct", s:"Honesty is a best policy.", a:"Honesty is the best policy.", why:"A superlative takes 'the'."},
   {t:"correct", s:"The poverty is a major cause of the crime in our society.", a:"Poverty is a major cause of crime in our society.", why:"Abstract nouns used in general take no article."},
   {t:"correct", s:"He is an European and an useful member of the team.", a:"He is a European and a useful member of the team.", why:"'European' and 'useful' begin with a 'yoo' (consonant) sound."},
   {t:"correct", s:"Sun rises in east and sets in west.", a:"The sun rises in the east and sets in the west.", why:"Unique things and compass directions take 'the'."}
  ]},
{ id:20, group:"gram", title:"Parallelism & correlatives", sub:"not only… but also, either… or",
  lede:"Your first topic sentence ('The question is not about that… but it is what about…') broke this rule. Balanced structures make sentences sound educated.",
  lesson:`<h3>Keep paired and listed items in the same form</h3>
  <ul><li><b>Lists:</b> "The policy aims at reducing poverty, improving schools and creating jobs", not "…and to create jobs".</li>
  <li><b>Correlatives</b> are not only… but also, either… or, neither… nor, both… and, whether… or. Put the <i>same grammatical form</i> after each half, and place the first half directly before the part being paired.</li></ul>
  <div class="pair"><div class="w"><b>Unbalanced</b>He not only failed in English but also in Essay.</div><div class="s"><b>Balanced</b>He failed not only in English but also in Essay.</div></div>
  <ul><li><b>not X but Y:</b> "The problem is not <i>how many</i> children are out of school but <i>how much</i> those in school are learning."</li>
  <li><b>Comparisons:</b> compare like with like: "Pakistan's literacy rate is lower than <i>that of</i> Sri Lanka", not "…lower than Sri Lanka".</li></ul>`,
  items:[
   {t:"mcq", q:"Which sentence is correctly parallel?", o:["The policy aims at reducing poverty, improving schools, and to create jobs.","The policy aims at reducing poverty, improving schools, and creating jobs.","The policy aims to reduce poverty, improving schools, and job creation.","The policy aims at poverty reduction, to improve schools, and creating jobs."], a:1, why:"All three items are -ing forms after 'aims at'."},
   {t:"mcq", q:"Which places 'not only' correctly?", o:["He not only failed in English but also in Essay.","Not only he failed in English but also in Essay.","He failed not only in English but also in Essay.","He failed in not only English but also failed in Essay."], a:2, why:"'Not only… but also' pairs 'in English' with 'in Essay', so each half comes directly before its phrase."},
   {t:"mcq", q:"Choose the correct comparison.", o:["Pakistan's literacy rate is lower than Sri Lanka.","Pakistan's literacy rate is lower than that of Sri Lanka.","Pakistan's literacy rate is lower than Sri Lanka's literacy.","Pakistan's literacy rate is more lower than Sri Lanka."], a:1, why:"Compare rate with rate ('that of'), not a rate with a country."},
   {t:"correct", s:"The question is not about that Pakistan has the most out-of-school children, but it is what about the students who are enrolled in schools.", a:"The real question is not how many children are out of school but how much those in school are learning.", why:"This is your own sentence, rebuilt with a balanced 'not X but Y'. Both halves are 'how + clause'."},
   {t:"correct", s:"She likes reading, writing and to travel.", a:"She likes reading, writing and travelling.", why:"Keep all list items in the -ing form."},
   {t:"correct", s:"Either you can apply now or wait until next year.", a:"You can either apply now or wait until next year.", why:"'Either… or' should pair two verbs: 'either apply… or wait'."},
   {t:"correct", s:"Our aim is not to punish but reforming offenders.", a:"Our aim is not to punish offenders but to reform them.", why:"Both halves must be infinitives: 'to punish… to reform'."},
   {t:"write", q:"Write THREE sentences on exam topics: one with 'not only… but also', one with 'either… or' or 'neither… nor', and one with 'not X but Y'.", task:"Write three sentences on Pakistani exam topics using (1) not only… but also, (2) either… or / neither… nor, (3) not X but Y.", focus:"parallel structure and correct use of correlative conjunctions: is each correlative placed directly before the pair it joins, and are both halves in the same grammatical form? Also check articles, agreement and tense.", max:9}
  ]},
{ id:21, group:"gram", title:"Sentence combining", sub:"Build complex sentences",
  lede:"Short, choppy sentences read as weak English. Combining two or three ideas into one controlled sentence is what separates a 12/20 essay from a 16/20 one.",
  lesson:`<h3>Five combining tools</h3>
  <ul><li><b>Coordination:</b> and, but, so, yet, or, with a comma before them when joining full clauses.</li>
  <li><b>Subordination:</b> although, because, while, whereas, unless, since, when, if. "<i>Although</i> Pakistan has coal, it imports fuel."</li>
  <li><b>Relative clause:</b> who, which, whose. Put commas around it if it adds extra information: "The Indus, <i>which</i> is Pakistan's lifeline, is shrinking."</li>
  <li><b>Participial phrase:</b> "<i>Hit by floods,</i> Sindh lost much of its cotton crop."</li>
  <li><b>Appositive:</b> "Dr Abdus Salam, <i>a Pakistani physicist</i>, won the Nobel Prize."</li></ul>
  <p>Variety is the goal. Don't make every sentence long; mix one combined sentence with a short, punchy one.</p>`,
  items:[
   {t:"mcq", q:"Best combination: \"Pakistan has abundant coal. It still imports expensive fuel.\"", o:["Pakistan has abundant coal and it still imports expensive fuel.","Although Pakistan has abundant coal, it still imports expensive fuel.","Pakistan has abundant coal, it still imports expensive fuel.","Because Pakistan has abundant coal, it still imports expensive fuel."], a:1, why:"'Although' shows the contrast. 'And' hides the logic, C is a comma splice, and 'because' gives the wrong logic."},
   {t:"mcq", q:"Which relative clause is punctuated correctly (Pakistan has only one capital)?", o:["Islamabad which is the capital of Pakistan is a planned city.","Islamabad, which is the capital of Pakistan, is a planned city.","Islamabad, that is the capital of Pakistan, is a planned city.","Islamabad which is the capital of Pakistan, is a planned city."], a:1, why:"It is extra information, so it needs commas on both sides and 'which', not 'that'."},
   {t:"correct", s:"The Indus is Pakistan's lifeline. It is shrinking because of climate change.", a:"The Indus, which is Pakistan's lifeline, is shrinking because of climate change.", why:"A non-defining relative clause. "+COMBO_NOTE},
   {t:"correct", s:"The floods hit Sindh in 2022. Millions of people lost their homes.", a:"When the floods hit Sindh in 2022, millions of people lost their homes.", why:"Subordinate with 'when'. "+COMBO_NOTE},
   {t:"correct", s:"Dr Abdus Salam won the Nobel Prize in Physics. He was a Pakistani scientist.", a:"Dr Abdus Salam, a Pakistani scientist, won the Nobel Prize in Physics.", why:"An appositive. "+COMBO_NOTE},
   {t:"correct", s:"Girls' education is neglected. This hurts the economy. Educated women add to the workforce.", a:"Neglecting girls' education hurts the economy, because educated women add to the workforce.", why:"Three ideas in one sentence: a gerund subject plus a 'because' clause. "+COMBO_NOTE},
   {t:"correct", s:"The government announced free textbooks. Many parents still keep their children at home. They need them to earn.", a:"Although the government announced free textbooks, many parents still keep their children at home because they need them to earn.", why:"Contrast ('although') plus a reason ('because'). "+COMBO_NOTE},
   {t:"write", q:"Combine these short sentences into a smooth paragraph of 3–4 sentences. Use at least one 'although/whereas', one relative clause and one participial phrase.", ctx:"Sindh is an agricultural province. Most of its farmers depend on the Indus. The river's flow is falling. Glaciers are melting faster. Rainfall has become irregular. Farmers are planting less cotton. Rural incomes are dropping. Many young men are moving to Karachi.",
     task:"Combine the given short sentences into a smooth paragraph of 3–4 sentences, using at least one 'although/whereas', one relative clause and one participial phrase.", focus:"sentence combining. Are the ideas joined with correct subordinators, relative clauses and participial phrases? Is the logic (cause, contrast, result) clear? Are there any comma splices, dangling participles or agreement errors?", max:10}
  ]},
{ id:22, group:"gram", title:"Punctuation", sub:"5 marks in the paper",
  lede:"CSS sets an unpunctuated passage every year (Q5a, 5 marks). The same rules keep your essays free of comma splices.",
  lesson:`<h3>Rules you'll use every time</h3>
  <ul><li><b>Capitals:</b> sentence starts, proper nouns, days, months, languages, the pronoun I.</li>
  <li><b>Comma:</b> after an introductory word or clause ("However, …", "When the rains came, …"); before and/but/so when joining two full clauses; around extra (non-defining) information; between list items; before a direct quotation.</li>
  <li><b>Semicolon:</b> between two closely linked full sentences, and before however, therefore or moreover when they join sentences.</li>
  <li><b>Colon:</b> before a list or an explanation that the first clause sets up.</li>
  <li><b>Apostrophe:</b> possession (the children's books, the boys' hostel, Ali's pen). Remember <i>it's</i> = it is, but <i>its</i> = belonging to it.</li>
  <li><b>Inverted commas:</b> around exact spoken words, with the end punctuation inside: He said, "Open your books."</li></ul>
  <p>Method for the paper: first mark the sentence ends, then the speech, then the commas.</p>`,
  items:[
   {t:"mcq", q:"Choose the correct sentence.", o:["The committee submitted it's report.","The committee submitted its report.","The committee submitted its' report.","The committee submitted it is report."], a:1, why:"'Its' is possessive. 'It's' means 'it is'."},
   {t:"mcq", q:"Choose the correctly punctuated sentence.", o:["Prices are rising, therefore, people are cutting spending.","Prices are rising; therefore, people are cutting spending.","Prices are rising therefore people are cutting spending.","Prices are rising: therefore people, are cutting spending."], a:1, why:"'Therefore' joins two sentences, so use a semicolon before it and a comma after it."},
   {t:"mcq", q:"\"My brother who lives in Karachi is a doctor.\" The writer has only one brother. What is needed?", o:["Nothing","Commas around 'who lives in Karachi'","A semicolon after 'brother'","A colon after 'Karachi'"], a:1, why:"With only one brother, the clause is extra information (non-defining), so it takes commas."},
   {t:"correct", s:"pakistan which came into being in 1947 is the fifth most populous country in the world", a:"Pakistan, which came into being in 1947, is the fifth most populous country in the world.", why:"A capital letter, commas around the non-defining clause, and a full stop."},
   {t:"correct", s:"the teacher said open your books on page ten", a:"The teacher said, \"Open your books on page ten.\"", why:"A comma before the speech, inverted commas, a capital at the start of the speech, and the full stop inside."},
   {t:"correct", s:"however the government did not listen to the farmers demands", a:"However, the government did not listen to the farmers' demands.", why:"A comma after an introductory 'however', and a plural possessive: farmers'."},
   {t:"correct", s:"ali asked his father why do the rich get richer his father smiled and said because they make money work for them while the poor work for money", a:"Ali asked his father, \"Why do the rich get richer?\" His father smiled and said, \"Because they make money work for them, while the poor work for money.\"", why:"This is exam-style: two speech sentences, a question mark inside the inverted commas, and capitals for names and sentence starts."}
  ]},
{ id:23, group:"gram", title:"Common errors", sub:"Errors examiners see every year",

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (k==="class") n.className = v;
    else if (k==="html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v===true) n.setAttribute(k,"");
    else if (v!==false && v!=null) n.setAttribute(k,v);
  }
  for (const c of kids.flat()) if (c!=null) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
const wc = t => (t.trim().match(/\S+/g)||[]).length;
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderMark(text){
  const lines = esc(text).split(/\n/);
  let html = "", inList = false;
  for (let ln of lines){
    ln = ln.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*/,"");
    const m = ln.match(/^\s*[-•*]\s+(.*)/);
    if (m){ if(!inList){html+="<ul>";inList=true;} html+="<li>"+m[1]+"</li>"; }
    else { if(inList){html+="</ul>";inList=false;} if (ln.trim()) html+="<p>"+ln+"</p>"; }
  }
  if (inList) html+="</ul>";
  return html;
}
function seededShuffle(arr, seed){
  const a = arr.map((v,i)=>i); let s = seed;
  for (let i=a.length-1;i>0;i--){ s = (s*9301+49297)%233280; const j = Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if (a.every((v,i)=>v===i)) a.reverse();
  return a;
}
function autoItems(ex){ return ex.items.map((it,i)=>({it,i})).filter(x=>!["write","peel","timed","comp","precis"].includes(x.it.t)); }
function exProgress(ex){
  const auto = autoItems(ex);
  if (!auto.length){ const k = ex.id+"-done"; return {done: state.items[k]?1:0, total:1}; }
  const done = auto.filter(x=>state.items[ex.id+"-"+x.i]).length;
  return {done,total:auto.length};
}
function record(key, val){ state.items[key]=val; save(); updateNav(); }
