<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CCE English Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f2ea; --surface:#fffdf8; --ink:#1c2331; --muted:#5b6372; --line:#e2dccd;
  --rule:#dbe3ee; --margin:#d4455c; --accent:#1f4e8c; --accent-ink:#ffffff; --accent-soft:#e3ebf6;
  --ok:#2b7a4b; --ok-soft:#e2f1e7; --bad:#b0291f; --bad-soft:#fae6e3; --warn-soft:#fbf1d9;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161c; --surface:#1b1f27; --ink:#e6e8ed; --muted:#9aa2b0; --line:#2c313b;
  --rule:#262d3a; --margin:#e26b7e; --accent:#8db3ee; --accent-ink:#0f1b2e; --accent-soft:#21304a;
  --ok:#6cc48e; --ok-soft:#1c3226; --bad:#f08b81; --bad-soft:#3a2321; --warn-soft:#3a321c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161c; --surface:#1b1f27; --ink:#e6e8ed; --muted:#9aa2b0; --line:#2c313b;
  --rule:#262d3a; --margin:#e26b7e; --accent:#8db3ee; --accent-ink:#0f1b2e; --accent-soft:#21304a;
  --ok:#6cc48e; --ok-soft:#1c3226; --bad:#f08b81; --bad-soft:#3a2321; --warn-soft:#3a321c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:24px}
header.top h1{font-family:var(--serif);font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em}
header.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.overall{font-size:13px;color:var(--muted);text-align:right}
.overall b{font-family:var(--serif);font-size:24px;color:var(--ink);display:block;line-height:1}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
nav.ex{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 32px);overflow-y:auto}
nav.ex a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;border:1px solid transparent}
nav.ex a:hover{background:var(--surface);border-color:var(--line)}
nav.ex a.on{background:var(--surface);border-color:var(--ink)}
nav.ex .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--muted);color:var(--muted)}
nav.ex a.on .n{border-color:var(--accent);color:var(--accent)}
nav.ex .n.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
nav.ex .lbl{min-width:0}
nav.ex .lbl small{display:block;color:var(--muted);font-size:11.5px}
main{min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--margin);font-weight:600}
h2{font-family:var(--serif);font-size:clamp(24px,3vw,32px);line-height:1.15;margin:4px 0 8px;text-wrap:balance}
h3{font-family:var(--serif);font-size:20px;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);max-width:65ch;margin:0 0 20px}
.lesson{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--margin);border-radius:10px;padding:18px 20px;margin-bottom:22px}
.lesson p,.lesson li{max-width:68ch}
.lesson ul{padding-left:20px;margin:8px 0}
.formula{font-family:var(--serif);font-size:18px;background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin:10px 0}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.pair div{border-radius:8px;padding:10px 12px;font-family:var(--serif);font-size:16px}
.pair .w{background:var(--bad-soft)} .pair .s{background:var(--ok-soft)}
.pair b{font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card .qn{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.card .q{font-weight:500;margin:0 0 10px}
.ctx{font-family:var(--serif);font-size:16.5px;line-height:1.6;background:var(--bg);border-radius:8px;padding:12px 14px;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--serif);font-size:16px;line-height:1.45;background:var(--surface);color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.why{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);font-size:14px}
.why b{color:var(--ink)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--serif);font-size:16px;cursor:pointer}
.chk input{margin-top:5px;accent-color:var(--accent)}
.chk.right{border-color:var(--ok);background:var(--ok-soft)} .chk.wrong{border-color:var(--bad);background:var(--bad-soft)} .chk.missed{border-color:var(--ok);border-style:dashed}
.spot{font-family:var(--serif);font-size:17px;line-height:1.75}
.spot button{all:unset;cursor:pointer;border-radius:4px;padding:1px 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.spot button:hover:not([disabled]){background:var(--accent-soft)}
.spot button:focus-visible{outline:2px solid var(--accent)}
.spot button.right{background:var(--ok-soft);text-decoration:line-through;text-decoration-color:var(--margin)}
.spot button.wrong{background:var(--bad-soft)}
.fill{font-family:var(--serif);font-size:17px;line-height:2}
.fill select{font:inherit;font-size:15px;font-family:var(--sans);padding:2px 6px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.fill select.right{border-color:var(--ok);background:var(--ok-soft)} .fill select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pool,.built{display:flex;flex-direction:column;gap:6px}
.pool button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 12px;border:1.5px dashed var(--muted);border-radius:8px;font-family:var(--serif);font-size:16px}
.pool button:hover{border-color:var(--accent);border-style:solid}
.pool button:focus-visible{outline:2px solid var(--accent)}
.built ol{margin:0;padding-left:22px;font-family:var(--serif);font-size:16px;display:flex;flex-direction:column;gap:4px}
.built li.right{color:var(--ok)} .built li.wrong{color:var(--bad)}
.subl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:10px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.paper{width:100%;min-height:160px;resize:vertical;font-family:var(--serif);font-size:17px;line-height:30px;padding:4px 14px 4px 52px;border:1px solid var(--line);border-radius:8px;color:var(--ink);
  background-color:var(--surface);
  background-image:linear-gradient(to right,transparent 40px,var(--margin) 40px,var(--margin) 41.5px,transparent 41.5px),repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--rule) 29px,var(--rule) 30px);
  background-attachment:local;background-position:0 4px}
.paper.short{min-height:94px}
.paper:focus{outline:2px solid var(--accent);outline-offset:1px}
.meta{font-size:12.5px;color:var(--muted)}
.fb{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;font-size:14.5px}
.fb .mark{border-left:3px solid var(--margin);padding-left:12px;white-space:normal}
.fb .mark p{margin:0 0 6px}
.fb .mark ul{margin:0 0 6px;padding-left:18px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.copied{color:var(--ok);font-size:13px}
textarea.copyout{width:100%;min-height:120px;font-size:12.5px;margin-top:8px;font-family:var(--sans);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.peel{display:grid;gap:12px}
.peel label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
.peel label span{font-weight:400;color:var(--muted)}
.peel .tag{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--margin);color:var(--surface);font-size:12px;margin-right:6px}
.preview{font-family:var(--serif);font-size:17px;line-height:1.65;background:var(--bg);border-radius:8px;padding:14px 16px;min-height:60px;max-width:72ch}
.preview .ph{color:var(--muted);font-style:italic}
.timer{font-family:var(--serif);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.timer.over{color:var(--margin)}
.topicbox{font-family:var(--serif);font-size:20px;line-height:1.35;padding:12px 16px;border:1.5px solid var(--ink);border-radius:8px;background:var(--surface)}
select.top{font:inherit;padding:7px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.grid a{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.grid a:hover{border-color:var(--ink)}
.grid .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--margin);font-weight:600}
.grid h3{margin:4px 0}
.grid p{margin:0;color:var(--muted);font-size:13.5px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:8px;max-width:68ch}
.steps li{counter-increment:s;padding-left:34px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;display:grid;place-items:center}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.pager a{color:var(--accent);text-decoration:none;font-weight:500}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500;text-transform:none;letter-spacing:0}
.navg{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--margin);font-weight:600;padding:14px 10px 4px}
.navg:first-of-type{padding-top:4px}
.passage p{margin:0 0 10px}
.passage sup{color:var(--margin);font-family:var(--sans);font-size:10px;font-weight:600;margin-right:2px}
.ptitle{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
details summary{cursor:pointer;font-weight:500;margin-bottom:8px}
.tagrows{display:flex;flex-direction:column;gap:6px}
.tagrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px}
.tagrow.right{border-color:var(--ok);background:var(--ok-soft)} .tagrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tagrow .ts{font-family:var(--serif);font-size:15.5px;line-height:1.45}
.tagrow sup{color:var(--margin);font-family:var(--sans);font-size:10px;font-weight:600;margin-right:3px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:12.5px;padding:5px 9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.tM{background:var(--ok);color:var(--surface)} .seg button.on.tS{background:var(--accent);color:var(--accent-ink)} .seg button.on.tC{background:var(--margin);color:var(--surface)}
.seg button:disabled{cursor:default}
.titlein,.prepin{font-family:var(--serif);font-size:17px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.titlein{width:100%}
.prepin{width:7.5em;margin:0 4px}
.prepin.right{border-color:var(--ok);background:var(--ok-soft)} .prepin.wrong{border-color:var(--bad);background:var(--bad-soft)}
table.pattern{border-collapse:collapse;font-size:14px;min-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table.pattern th,table.pattern td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line)}
table.pattern th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (max-width:560px){ .tagrow{grid-template-columns:minmax(0,1fr)} }
@media (max-width:820px){
  .navg{padding:6px 4px;flex:none;align-self:center}
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.ex{position:static;flex-direction:row;overflow-x:auto;overflow-y:visible;max-height:none;padding-bottom:6px;gap:6px}
  nav.ex a{flex:none;padding:6px 10px}
  nav.ex .lbl small{display:none}
  .overall{text-align:left}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>CCE English Gym</h1>
      <p>Two tracks: paragraph writing for the Essay paper, and every question of the Précis &amp; Composition paper, built on real CSS past-paper items.</p>
    </div>
    <div class="overall"><b id="overallPct">0%</b>drills completed</div>
  </header>
  <div class="layout">
    <nav class="ex" id="nav" aria-label="Exercises"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- storage (per-viewer convenience only) ---------- */
const KEY = "paragraph-gym-v1";
let state = { items:{}, drafts:{} };
try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && typeof s === "object") state = Object.assign(state, s); } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* ---------- AI feedback via Claude (optional) ---------- */
let sample = null, aiStatus = "pending";
const aiListeners = [];
function setAi(s){ aiStatus = s; aiListeners.forEach(f=>{ try{f();}catch(e){} }); }
try {
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then(fn => { sample = fn; setAi(fn ? "ready" : "none"); }).catch(()=>setAi("none"));
  } else { setTimeout(()=>setAi("none"),0); }
} catch(e){ setTimeout(()=>setAi("none"),0); }

/* ---------- content ---------- */
const TOPICS = [
  "Climate change and Pakistan's food security",
  "Out-of-school children in Pakistan",
  "Women's economic empowerment",
  "Corruption and accountability",
  "Population growth as a challenge",
  "Social media and political polarisation",
  "CPEC: opportunity or debt trap?",
  "Local government and service delivery",
  "The energy crisis and circular debt",
  "Brain drain from Pakistan",
  "Artificial intelligence and jobs",
  "Water scarcity in Sindh",
  "Democracy and economic development",
  "Terrorism and national security",
  "The role of youth in nation-building"
];

const EX = [
{ id:1, title:"Topic sentences", sub:"Topic + controlling idea",
  lede:"Every exam paragraph lives or dies by its first sentence. The examiner should know your point before reading further.",
  lesson:`<h3>What a topic sentence does</h3>
  <p>It names the <b>topic</b> and makes a specific, arguable claim about it, the <b>controlling idea</b>. Everything else in the paragraph proves that claim.</p>
  <div class="formula">Topic + controlling idea (+ reason, if it fits) = topic sentence</div>
  <p>Four common faults:</p>
  <ul><li><b>Too broad or a cliché:</b> "Education is the backbone of a nation."</li>
  <li><b>Too narrow, just a fact:</b> "Pakistan's literacy rate is about 60 per cent." A fact is evidence, not a claim.</li>
  <li><b>An announcement:</b> "In this paragraph I will discuss…"</li>
  <li><b>A question:</b> "Is democracy good for Pakistan?"</li></ul>
  <div class="pair"><div class="w"><b>Weak</b>Corruption is a big problem.</div><div class="s"><b>Strong</b>Corruption persists in Pakistan largely because accountability institutions are not independent of the governments they are meant to check.</div></div>`,
  items:[
   {t:"mcq", q:"Topic: climate change. Which is the strongest topic sentence?", o:[
     "Climate change is a big problem in the world today.",
     "Pakistan contributes less than one per cent of global greenhouse gas emissions.",
     "Climate change threatens Pakistan's food security above all, because its agriculture depends on predictable water.",
     "In this paragraph I will discuss climate change."], a:2,
     why:"Option C names the topic and makes a focused claim (food security) with a reason. A is a cliché, B is a fact (good evidence, poor topic sentence), D is an announcement."},
   {t:"mcq", q:"Topic: women's empowerment. Pick the strongest topic sentence.", o:[
     "What is women's empowerment?",
     "Women make up about half of Pakistan's population.",
     "Women's empowerment has many aspects, causes, effects and solutions in every country.",
     "Economic independence is the surest route to women's empowerment in Pakistan, because it gives women a voice at home and in society."], a:3,
     why:"D has one controlling idea (economic independence) and a reason. A is a question, B is a bare fact, and C lists everything, so it controls nothing."},
   {t:"mcq", q:"Topic: social media. Pick the strongest topic sentence.", o:[
     "Social media has deepened political polarisation in Pakistan by rewarding outrage over evidence.",
     "Social media, which includes Facebook, X, TikTok, YouTube and Instagram, is used by many people.",
     "Is social media a blessing or a curse?",
     "Social media has good and bad effects."], a:0,
     why:"A makes a debatable claim and says how (rewarding outrage). B is description, C is a question, and D is too vague to argue."},
   {t:"mcq", q:"What is wrong with this topic sentence: \"Education is the backbone of a nation\"?", o:[
     "It is a cliché with no specific controlling idea.",
     "It is too narrow.",
     "It is a question.",
     "It is grammatically incorrect."], a:0,
     why:"Examiners read this line hundreds of times. It claims nothing specific about Pakistan or about education. Try: \"Pakistan cannot become a knowledge economy while 26 million of its children are out of school.\""},
   {t:"mcq", q:"Which sentence is a fact that belongs in the body, not a topic sentence?", o:[
     "Weak local government is the main reason basic services fail in Pakistan's cities.",
     "The 2023 census counted about 241 million people in Pakistan.",
     "Pakistan's population growth will cancel out its economic gains unless family planning becomes a national priority.",
     "Brain drain is costing Pakistan the very professionals it needs for reform."], a:1,
     why:"B can be checked but not argued, so it is evidence. A, C and D each take a position you would then have to prove."},
   {t:"write", q:"Write ONE topic sentence for each topic below (three sentences in all). Give each a clear controlling idea.", ctx:"1. Out-of-school children\n2. Population growth\n3. CPEC", short:false,
     task:"Write one topic sentence each for: (1) out-of-school children, (2) population growth, (3) CPEC.",
     focus:"topic sentences. For EACH of the three sentences: does it have a clear topic plus a specific, arguable controlling idea? Is it neither too broad nor too narrow? Is it free of clichés, announcements and questions?", max:9}
  ]},
{ id:2, title:"Supporting details", sub:"Explain the controlling idea",
  lede:"Support sentences answer the reader's question \"Why?\" or \"How?\" after your topic sentence.",
  lesson:`<h3>Support explains; it doesn't wander</h3>
  <p>After the topic sentence, add two or three sentences that <b>explain</b> the claim: reasons, causes, mechanisms, consequences. Every one must connect to the <b>controlling idea</b>, not just to the general topic.</p>
  <ul><li>Ask "why?" or "how?" about your topic sentence. The answers are your support.</li>
  <li>Move from general to specific: a reason, then how it works.</li>
  <li>Background facts ("X was founded in…") are not support unless they prove the claim.</li></ul>
  <div class="pair"><div class="w"><b>Off target</b>TS: Economic independence empowers women. → "Pakistan has many talented women cricketers."</div><div class="s"><b>On target</b>"A woman who earns her own income gains a say in decisions about her children's schooling, her health and her marriage."</div></div>`,
  items:[

{ id:3, title:"Examples & evidence", sub:"Prove it with specifics",
  lede:"A claim without evidence is opinion. CSS examiners reward specific, Pakistan-relevant proof.",
  lesson:`<h3>Four kinds of evidence</h3>
  <ul><li><b>Statistic:</b> "About 26 million children aged 5–16 are out of school."</li>
  <li><b>Case or event:</b> "The 2022 floods…"</li>
  <li><b>Authority or report:</b> "According to UNICEF…", "The Economic Survey notes…"</li>
  <li><b>Comparison:</b> "Unlike Bangladesh, which…"</li></ul>
  <p>Introduce evidence with a signal phrase (<i>For instance, A case in point is, According to</i>), then add <b>one sentence that explains what it proves</b>. Evidence never speaks for itself.</p>
  <div class="pair"><div class="w"><b>Vague</b>For example, everyone knows the floods were very bad.</div><div class="s"><b>Specific</b>A case in point is the 2022 floods, which affected about 33 million people and caused damage and losses estimated at over 30 billion dollars.</div></div>
  <p class="note">Check every figure against a current source (the Economic Survey, PBS, UNICEF, the World Bank) before the exam. Rounded and attributed numbers are safer than invented exact ones.</p>`,
  items:[
   {t:"mcq", q:"Claim: \"Pakistan is among the countries most vulnerable to climate change.\" Which is the best evidence?", o:[
     "Many people say the weather is changing.",
     "Climate change is often discussed at the United Nations.",
     "The 2022 floods affected about 33 million people and caused damage and losses estimated at over 30 billion dollars.",
     "Pakistan has four provinces and several territories."], a:2,
     why:"C is specific, attributable and directly shows vulnerability. A is hearsay, B is general, and D is irrelevant."},
   {t:"mcq", q:"Claim: \"Pakistan's tax base is too narrow to fund its development.\" Which evidence fits best?", o:[
     "Taxes are collected in most countries of the world.",
     "Pakistan's tax-to-GDP ratio has hovered around ten per cent, well below what most comparable developing economies collect.",
     "The Federal Board of Revenue has offices in many cities.",
     "Some people do not like paying taxes."], a:1,
     why:"B gives a measurable indicator and a comparison, which is what makes evidence persuasive."},
   {t:"mcq", q:"Why is this evidence weak? \"For example, everybody knows that corruption is everywhere.\"", o:[
     "It uses a signal phrase.",
     "It is too long.",
     "It is vague and unattributed: no case, figure or source.",
     "It is written in the passive voice."], a:2,
     why:"'Everybody knows' is an appeal to common opinion. Replace it with a case, a report (for example, Transparency International's Corruption Perceptions Index), or a documented example."},
   {t:"mcq", q:"After giving evidence, what should the next sentence normally do?", o:[
     "Start a new topic.",
     "Explain how the evidence proves the controlling idea.",
     "Repeat the evidence in different words.",
     "Ask the reader a question."], a:1,
     why:"This is the 'E' in PEEL: link the evidence back to the claim. Examiners call missing explanation 'dumping facts'."},

{ id:4, title:"Concluding sentences", sub:"Close the loop",
  lede:"The last sentence tells the examiner the point has been proved, and why it matters.",
  lesson:`<h3>Three good ways to end</h3>
  <ul><li><b>Restate in new words:</b> return to the controlling idea, but not word for word.</li>
  <li><b>Show significance:</b> so what? What follows if the claim is true?</li>
  <li><b>Link forward:</b> in an essay, point toward the next paragraph's idea.</li></ul>
  <p><b>Avoid:</b> introducing a new point, copying the topic sentence word for word, "In conclusion, as I said above…", or "That is all about…".</p>
  <div class="pair"><div class="w"><b>Weak</b>So, corruption is a big problem, as discussed above.</div><div class="s"><b>Strong</b>Without truly independent watchdogs, anti-corruption drives will remain slogans rather than reforms.</div></div>`,
  items:[
   {t:"mcq", q:"Choose the best concluding sentence for this paragraph.", ctx:"Climate change threatens Pakistan's food security above all. Its farms rely on glacier melt and monsoon rains, both now less predictable. Heatwaves in spring shrink wheat yields, while floods destroy standing crops. In 2022, millions of acres of cropland were submerged in Sindh alone. ______",
     o:["Climate change threatens Pakistan's food security above all.",
        "Unless Pakistan adapts its farming to an uncertain climate, its food security will remain at the mercy of the weather.",
        "Moreover, climate change also affects tourism in the north.",
        "That is all about climate change."], a:1,

        "Without truly independent watchdogs, anti-corruption drives will remain slogans rather than reforms.",
        "Accountability is a very wide topic."], a:2,

{ id:5, title:"Unity", sub:"Cut the sentence that strays",
  lede:"A unified paragraph proves ONE idea. One off-topic sentence costs marks under 'Unity & development'.",
  lesson:`<h3>The unity test</h3>
  <p>Hold each sentence against the <b>controlling idea</b>, not the broad topic, and ask: "Does this help prove that claim?" If not, it goes, however true or interesting it is.</p>
  <p>Exam candidates usually break unity in three ways: adding a related fact they happen to know, drifting into a solution when the paragraph is about causes, or adding a quotation that sounds impressive but proves nothing.</p>
  <p><b>In the drills below, click the sentence that breaks unity.</b></p>`,
  items:[
   {t:"spot", s:["Load-shedding is crippling Pakistan's small industries.","Textile workshops in Faisalabad lose hours of production whenever the power fails.","Owners must buy generators and diesel, which raises their costs sharply.","Pakistan's mountains include some of the highest peaks in the world.","As a result, many small firms can no longer compete with cheaper imports."], a:3,
     why:"The mountains are true but have nothing to do with load-shedding and industry."},
   {t:"spot", s:["Reading habits among Pakistani youth are declining.","Many students now spend more hours on short videos than on books.","Allama Iqbal was born in Sialkot in 1877.","Public libraries in many towns are poorly stocked and rarely visited.","Even university students often read only what the syllabus demands."], a:2,
     why:"Iqbal's birth is a 'famous fact' dropped in. It does not show that reading is declining."},
   {t:"spot", s:["Local government is essential for effective service delivery.","Local councillors know which streets need drains and which schools need teachers.","Citizens can hold a councillor to account far more easily than a distant minister.","The National Assembly debates the federal budget every June.","When local bodies are suspended, these decisions return to provincial departments far from the problem."], a:3,
     why:"The federal budget debate concerns the national level. It does not explain why local government matters for services."},
   {t:"spot", s:["Social media has deepened political polarisation in Pakistan.","Its algorithms reward posts that provoke anger, so the angriest voices travel furthest.","Supporters of each party increasingly see only content that confirms their views.","The government should launch digital literacy programmes in every school.","As a result, compromise now looks like betrayal to many voters."], a:3,
     why:"This is a solution sentence inside a paragraph about causes and effects. Save it for the solutions section of your essay."}
  ]},
{ id:6, title:"Coherence", sub:"Transitions and logical order",
  lede:"Coherence is how smoothly the reader moves from one sentence to the next: the right linking words in the right order.",
  lesson:`<h3>Transitions by job</h3>
  <ul><li><b>Addition:</b> moreover, furthermore, in addition</li>
  <li><b>Contrast:</b> however, by contrast, nevertheless, yet</li>
  <li><b>Cause and effect:</b> therefore, consequently, as a result, thus</li>
  <li><b>Example:</b> for instance, a case in point is</li>
  <li><b>Sequence and conclusion:</b> first, then, ultimately</li></ul>
  <p>Coherence also comes from <b>repeating key terms</b> and <b>pronouns</b> that point back clearly ("this policy", "such shocks"). Do not overuse transitions: one in every sentence reads as mechanical.</p>
  <p>Logical order: claim → explanation → evidence → consequence → link.</p>`,
  items:[
   {t:"fill", q:"Choose the right transition for each gap.", parts:["Pakistan has one of the youngest populations in the world. ","{0}",", this could become a demographic dividend. ","{1}",", without education and jobs, it may turn into a burden. ","{2}",", investment in skills is urgent."],
     choices:["However","Therefore","In theory","For instance","Moreover"], a:["In theory","However","Therefore"],
     why:"'In theory' sets up a possibility, 'However' turns to the risk, and 'Therefore' draws the conclusion."},
   {t:"fill", q:"Choose the right transition for each gap.", parts:["Most farmers in Sindh still use flood irrigation. ","{0}",", a large share of canal water is lost before it reaches crops. ","{1}",", drip and sprinkler systems deliver water directly to the roots. ","{2}",", the province should subsidise efficient irrigation."],
     choices:["As a result","By contrast","Thus","For example","Furthermore"], a:["As a result","By contrast","Thus"],
     why:"Cause → effect (As a result), alternative (By contrast), conclusion (Thus)."},
   {t:"order", q:"Put these sentences in the most logical order. Click them one by one.", s:[
     "Accountability fails in Pakistan mainly because watchdog institutions are not independent.",
     "Their heads are often appointed and removed by the very governments they are supposed to investigate.",
     "As a result, cases against ruling parties stall, while cases against opponents move quickly.",
     "This selective justice has damaged public trust in the whole process.",
     "Real reform, therefore, must begin by shielding these institutions from political control."],
     why:"Claim → cause → consequence ('As a result') → wider effect ('This selective justice') → link ('therefore'). The pronouns and transitions are the clues."},
   {t:"order", q:"Put these sentences in the most logical order.", s:[
     "Climate change is turning water security into Pakistan's most urgent national challenge.",
     "Its rivers depend on glaciers and monsoon rains, both of which are becoming less predictable.",
     "For instance, the 2022 floods followed an extreme monsoon, while other years bring severe drought.",
     "Such swings damage crops, homes and infrastructure alike.",
     "Unless storage and water management improve, these shocks will keep reversing development gains."],
     why:"Topic sentence → explanation → example ('For instance') → consequence ('Such swings') → concluding link ('Unless…')."}
  ]},
{ id:7, title:"Build a PEEL paragraph", sub:"Put it all together",
  lede:"Now build a full 150–220 word paragraph, one part at a time. The preview assembles it as you write.",
  lesson:`<h3>PEEL</h3>
  <div class="formula"><b>P</b>oint → <b>E</b>xplain → <b>E</b>vidence / Example → <b>L</b>ink</div>
  <ul><li><b>Point:</b> one topic sentence with a clear controlling idea (Ex 1).</li>
  <li><b>Explain:</b> two or three sentences on why or how (Ex 2).</li>
  <li><b>Evidence:</b> a specific figure, case or report, plus what it proves (Ex 3).</li>
  <li><b>Link:</b> a concluding sentence that closes the point or leads on (Ex 4).</li></ul>
  <p>Then check unity (Ex 5) and transitions (Ex 6). It is marked out of 20 on the Workshop rubric: topic sentence, unity and development, evidence and example, coherence, and language accuracy, at 4 marks each.</p>`,
  items:[{t:"peel"}]},
{ id:8, title:"Timed paragraph", sub:"Exam conditions",
  lede:"Exam conditions: one topic, 20 minutes, 180–250 words, no notes. Plan for 3 minutes, write for 14, revise for 3.",
  lesson:`<h3>Exam routine</h3>
  <ol class="steps"><li>Read the topic and decide your stance in one line.</li>
  <li>Jot P–E–E–L in the margin: four or five words each.</li>
  <li>Write. Start with the topic sentence and do not stop to polish.</li>
  <li>Spend the last three minutes on revision: articles, subject–verb agreement, tenses, one clear transition per idea.</li></ol>
  <p>Score 15 or more out of 20 consistently here, and you're ready to start full essays.</p>`,
  items:[{t:"timed"}]}
];

  ["A healthy society rests not only on its government but on the countless associations that citizens form among themselves.","Trade unions, mosque committees, parent–teacher bodies, neighbourhood welfare groups and bar councils all occupy the ground between the household and the state.","This ground, which scholars call civil society, is where people learn the habits of self-government long before they cast a vote.","A farmer who helps run a water users' association learns to keep accounts, settle disputes and answer to his fellows; these are the same virtues that a parliament demands of its members."],

function idiomMcq(i){
  const [id, m] = IDIOMS[i];
  const pool = IDIOMS.map(x=>x[1]).filter(x=>x!==m);
  const pick = seededShuffle(pool, i*13+5).slice(0,3).map(k=>pool[k]);
  const pos = (i*7)%4; const o = pick.slice(); o.splice(pos,0,m);
  return {t:"mcq", q:"\""+id+"\" means:", o, a:pos, why:id+": "+m+"."};
}

{ id:9, group:"comp", title:"Comprehension", sub:"20 marks · 5 questions",

{ id:14, group:"comp", title:"Sentence correction", sub:"10 marks · correct 5 of 8",
  lede:"These are the actual sentences from CSS 2023 and 2022. Write your correction, check it against the key, then mark yourself honestly.",
  lesson:`<h3>What examiners plant in these sentences</h3>
  <ul><li><b>Subject–verb agreement:</b> 'His knowledge … <i>aids</i>'; 'The ambassador, with his staff, <i>invites</i>'.</li>
  <li><b>Tense sequence:</b> a past main clause takes a past subordinate clause.</li>
  <li><b>Pronoun case:</b> 'Aslam and <i>I</i> plan'.</li>
  <li><b>Indirect question word order:</b> 'what the salary <i>was</i>', not 'what is the salary'.</li>
  <li><b>Correlatives:</b> 'so … that', not 'too … that'.</li>
  <li><b>Articles and prepositions:</b> '<i>the</i> guitar', 'smiled <i>at</i> me', 'sit <i>for</i> an examination'.</li></ul>
  <p>Rewrite the <b>whole</b> sentence in the exam, and change only what is wrong.</p>`,
  items:[
   {t:"correct", y:"2023", s:"His knowledge of languages and international relations aid him in his work.", a:"His knowledge of languages and international relations aids him in his work.", why:"The subject is 'knowledge' (singular). 'Languages and international relations' sit inside the prepositional phrase."},
   {t:"correct", y:"2023", s:"The ambassador, with his family and staff, invite you to a reception at the embassy on Tuesday afternoon.", a:"The ambassador, with his family and staff, invites you to a reception at the embassy on Tuesday afternoon.", why:"A phrase beginning 'with' or 'along with' does not make the subject plural."},
   {t:"correct", y:"2023", s:"This year, he will sit in the CSS examination.", a:"This year, he will sit for the CSS examination.", why:"The idiom is 'sit for an examination' (or 'take')."},
   {t:"correct", y:"2023", s:"The Chief Executive will let us know whether or not he can attend the meeting.", a:"The Chief Executive will let us know whether he can attend the meeting.", why:"'Whether' already includes the alternative, so 'or not' is redundant here."},
   {t:"correct", y:"2023", s:"When he came back from vacation, Aslam and me plan to look for another apartment.", a:"When he came back from vacation, Aslam and I planned to look for another apartment.", why:"Use the subject pronoun 'I', and keep the tense consistent: came → planned."},
   {t:"correct", y:"2023", s:"If some of you make a noise, they shall be punished.", a:"If any of you makes a noise, you will be punished.", why:"In a conditional use 'any', not 'some'. The pronoun must refer back to 'you', not 'they', and 'will' is the normal future here."},
   {t:"correct", y:"2023", s:"He came to me to enquire what is the salary attached to the appointment.", a:"He came to me to enquire what the salary attached to the appointment was.", why:"An indirect question uses statement word order (subject before verb), and the past reporting verb takes a past tense."},
   {t:"correct", y:"2023", s:"I am too tired that I do not hunt words and idioms in my English book.", a:"I am so tired that I cannot hunt for words and idioms in my English book.", why:"Use 'so … that' (or 'too tired to hunt'). 'Hunt for' takes a preposition."},
   {t:"correct", y:"2022", s:"I must walk two miles to school every morning when I was a child.", a:"I had to walk two miles to school every morning when I was a child.", why:"'Must' has no past form. Use 'had to' for past obligation."},
   {t:"correct", y:"2022", s:"After the storm, we had got to pick up some fallen branches.", a:"After the storm, we had to pick up some fallen branches.", why:"The simple past 'had to' fits. 'Had got to' is a wrong tense here."},
   {t:"correct", y:"2022", s:"Guitar is most popular instrument among teen age boys, but not girls.", a:"The guitar is the most popular instrument among teenage boys, but not among girls.", why:"'The' for a musical instrument, 'the' with a superlative, 'teenage' as one word, and a parallel 'among girls'."},
   {t:"correct", y:"2022", s:"You are not well and I wish you feel better soon.", a:"You are not well, and I hope you feel better soon.", why:"'Hope' for something possible in the future. 'Wish' is used for unreal situations."},
   {t:"correct", y:"2022", s:"The grass not looking green now because it is not raining since last month.", a:"The grass is not looking green now because it has not rained since last month.", why:"The auxiliary 'is' is missing, and 'since last month' needs the present perfect."},
   {t:"correct", y:"2022", s:"The cold air made me shiver a little when I was waiting for him.", a:"The cold air made me shiver a little while I was waiting for him.", why:"'While' for an action in progress during the main event."},
   {t:"correct", y:"2022", s:"I offered my seat to an older woman who just smiled me.", a:"I offered my seat to an older woman, who just smiled at me.", why:"'Smile at someone'. A comma is natural before a non-defining clause."},
   {t:"correct", y:"2022", s:"She packed her bags, carried downstairs and put the back seat of her car.", a:"She packed her bags, carried them downstairs and put them on the back seat of her car.", why:"'Carried' and 'put' need objects ('them'), and 'put … on the back seat' needs a preposition."}
  ]},

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (k==="class") n.className = v;
    else if (k==="html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v===true) n.setAttribute(k,"");
    else if (v!==false && v!=null) n.setAttribute(k,v);
  }
  for (const c of kids.flat()) if (c!=null) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
const wc = t => (t.trim().match(/\S+/g)||[]).length;
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderMark(text){
  const lines = esc(text).split(/\n/);
  let html = "", inList = false;
  for (let ln of lines){
    ln = ln.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*/,"");
    const m = ln.match(/^\s*[-•*]\s+(.*)/);
    if (m){ if(!inList){html+="<ul>";inList=true;} html+="<li>"+m[1]+"</li>"; }
    else { if(inList){html+="</ul>";inList=false;} if (ln.trim()) html+="<p>"+ln+"</p>"; }
  }
  if (inList) html+="</ul>";
  return html;
}
function seededShuffle(arr, seed){
  const a = arr.map((v,i)=>i); let s = seed;
  for (let i=a.length-1;i>0;i--){ s = (s*9301+49297)%233280; const j = Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  if (a.every((v,i)=>v===i)) a.reverse();
  return a;
}
function autoItems(ex){ return ex.items.map((it,i)=>({it,i})).filter(x=>!["write","peel","timed","comp","precis"].includes(x.it.t)); }
function exProgress(ex){
  const auto = autoItems(ex);
  if (!auto.length){ const k = ex.id+"-done"; return {done: state.items[k]?1:0, total:1}; }
  const done = auto.filter(x=>state.items[ex.id+"-"+x.i]).length;
  return {done,total:auto.length};
}
function record(key, val){ state.items[key]=val; save(); updateNav(); }

? `Mark it on this rubric, each criterion out of 4: Topic sentence; Unity & development; Evidence & example; Coherence; Language accuracy.
